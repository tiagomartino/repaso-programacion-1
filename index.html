operador in"}]}, {"id": "ex8", "kind": "corregir", "title": "Validar una edad con raise", "level": 2, "prompt": "<p><code>validar_edad(valor)<\/code> recibe un texto y debe devolver la edad como <code>int<\/code>. Tiene que <strong>lanzar<\/strong> <code>ValueError<\/code> si el texto no es un entero o si la edad no está entre 0 y 120. <code>edad_o_defecto(valor)<\/code> usa la función anterior y devuelve <code>-1<\/code> si hubo un <code>ValueError<\/code>. Hay <strong>tres errores<\/strong>.<\/p>", "starter": "def validar_edad(valor):\n    edad = int(valor)\n    if edad < 0 or edad > 120:\n        raise \"Edad fuera de rango\"\n    return edad\n\n\ndef edad_o_defecto(valor):\n    try:\n        return validar_edad(valor)\n    except Exception:\n        return -1\n    except ValueError:\n        return -1\n    finally:\n        return 0\n\n\nprint(validar_edad(\"30\"), edad_o_defecto(\"abc\"), edad_o_defecto(\"200\"))", "solution": "def validar_edad(valor):\n    edad = int(valor)\n    if edad < 0 or edad > 120:\n        raise ValueError(\"Edad fuera de rango\")\n    return edad\n\n\ndef edad_o_defecto(valor):\n    try:\n        return validar_edad(valor)\n    except ValueError:\n        return -1\n\n\nprint(validar_edad(\"30\"), edad_o_defecto(\"abc\"), edad_o_defecto(\"200\"))", "tests": [{"call": "validar_edad('30')", "expect": "30"}, {"call": "validar_edad('200')", "raises": "ValueError", "label": "validar_edad('200') lanza ValueError"}, {"call": "validar_edad('abc')", "raises": "ValueError", "label": "validar_edad('abc') lanza ValueError"}, {"call": "edad_o_defecto('abc')", "expect": "-1"}, {"call": "edad_o_defecto('200')", "expect": "-1"}, {"call": "edad_o_defecto('45')", "expect": "45"}], "explain": "<p>1) <code>raise<\/code> necesita una excepción, no un str: <code>raise ValueError(\"...\")<\/code> (con un str da <code>TypeError<\/code>). 2) El <code>except Exception<\/code> iba primero y tapaba todo: hay que capturar el error específico. 3) Un <code>return<\/code> dentro de <code>finally<\/code> pisa cualquier otro <code>return<\/code>, así que siempre devolvía 0.<\/p>"}, {"id": "ex9", "kind": "escribir", "title": "Registrar una venta", "level": 3, "prompt": "<p>Escribí <code>registrar_venta(stock, item, cantidad)<\/code> que reciba un diccionario de stock, descuente la cantidad y devuelva cuánto queda. Debe <strong>lanzar<\/strong>:<\/p>\n<ul>\n<li><code>KeyError<\/code> si el ítem no existe,<\/li>\n<li><code>ValueError<\/code> si la cantidad no es positiva o si no hay stock suficiente.<\/li>\n<\/ul>\n<p>Si lanza una excepción, el stock <strong>no<\/strong> se modifica. Después escribí <code>procesar(stock, ventas)<\/code> que reciba una lista de tuplas <code>(item, cantidad)<\/code>, intente registrar cada una y devuelva cuántas se pudieron registrar.<\/p>", "starter": "def registrar_venta(stock, item, cantidad):\n    pass\n\n\ndef procesar(stock, ventas):\n    pass\n\n\ns = {\"item1\": 100, \"item2\": 200}\nprint(procesar(s, [(\"item1\", 30), (\"item9\", 5), (\"item2\", 250), (\"item2\", -4), (\"item2\", 200)]), s)", "solution": "def registrar_venta(stock, item, cantidad):\n    if item not in stock:\n        raise KeyError(f\"no existe el ítem {item}\")\n    if cantidad <= 0:\n        raise ValueError(\"la cantidad debe ser positiva\")\n    if cantidad > stock[item]:\n        raise ValueError(f\"stock insuficiente (hay {stock[item]})\")\n    stock[item] -= cantidad\n    return stock[item]\n\n\ndef procesar(stock, ventas):\n    ok = 0\n    for item, cant in ventas:\n        try:\n            registrar_venta(stock, item, cant)\n            ok += 1\n        except (KeyError, ValueError) as e:\n            print(\"ERR\", item, e)\n    return ok\n\n\ns = {\"item1\": 100, \"item2\": 200}\nprint(procesar(s, [(\"item1\", 30), (\"item9\", 5), (\"item2\", 250), (\"item2\", -4), (\"item2\", 200)]), s)", "tests": [{"call": "registrar_venta({'a': 10}, 'a', 3)", "expect": "7"}, {"call": "registrar_venta({'a': 10}, 'b', 3)", "raises": "KeyError", "label": "ítem inexistente lanza KeyError"}, {"call": "registrar_venta({'a': 10}, 'a', 11)", "raises": "ValueError", "label": "stock insuficiente lanza ValueError"}, {"call": "registrar_venta({'a': 10}, 'a', 0)", "raises": "ValueError", "label": "cantidad 0 lanza ValueError"}, {"pre": "s = {'a': 10}\ntry:\n    registrar_venta(s, 'a', 50)\nexcept ValueError:\n    pass", "call": "s", "label": "si falla, el stock no cambia", "expect": "{'a': 10}"}, {"pre": "s = {'item1': 100, 'item2': 200}\nr = procesar(s, [('item1', 30), ('item9', 5), ('item2', 250), ('item2', -4), ('item2', 200)])", "call": "(r, s)", "label": "procesar 5 ventas → 2 registradas", "expect": "(2, {'item1': 70, 'item2': 0})"}]}]}, {"id": "archivos", "num": 11, "title": "Archivos de texto", "summary": "open, modos r/w/a, with, read/readline/readlines, write, procesar línea por línea y escribir otro archivo.", "theory": "<h2>Por qué archivos<\/h2>\n<p>Las variables viven en la <strong>memoria RAM<\/strong>: cuando termina el programa, se pierden. Para que los datos <strong>persistan<\/strong> hay que guardarlos en disco.<\/p>\n<blockquote>\n<p>En esta página, la consola tiene archivos de ejemplo (<code>notas.txt<\/code>, <code>latencias.txt<\/code>, <code>productos.json<\/code>…) para practicar <code>open()<\/code>. Los podés ver en \"Archivos disponibles\" dentro de la consola.<\/p>\n<\/blockquote>\n<h2>open y close<\/h2>\n<p><code>open(ruta, modo, encoding=\"utf-8\")<\/code> devuelve un objeto archivo. Siempre hay que <strong>cerrarlo<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Modo<\/th>\n<th>Qué hace<\/th>\n<th>Si no existe<\/th>\n<th>Si existe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>\"r\"<\/code><\/td>\n<td>leer (es el modo por defecto)<\/td>\n<td><code>FileNotFoundError<\/code><\/td>\n<td>lo lee<\/td>\n<\/tr>\n<tr>\n<td><code>\"w\"<\/code><\/td>\n<td>escribir<\/td>\n<td>lo crea<\/td>\n<td><strong>lo vacía<\/strong> al abrirlo<\/td>\n<\/tr>\n<tr>\n<td><code>\"a\"<\/code><\/td>\n<td>agregar al final<\/td>\n<td>lo crea<\/td>\n<td>escribe después de lo que hay<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre class=\"py\">archivo = open(&quot;prueba.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;)\narchivo.write(&quot;Ana,8\\n&quot;)         # write NO agrega el salto de línea\narchivo.write(&quot;Luis,6\\n&quot;)\narchivo.close()\n\narchivo = open(&quot;prueba.txt&quot;, &quot;a&quot;, encoding=&quot;utf-8&quot;)\narchivo.write(&quot;Mora,9\\n&quot;)\narchivo.close()\n\narchivo = open(&quot;prueba.txt&quot;, &quot;r&quot;, encoding=&quot;utf-8&quot;)\nprint(archivo.read())\narchivo.close()<\/pre>\n<h2>with: la forma recomendada<\/h2>\n<p><code>with<\/code> cierra el archivo solo al salir del bloque, <strong>aunque haya un error<\/strong>.<\/p>\n<pre class=\"py\">with open(&quot;notas.txt&quot;, &quot;r&quot;, encoding=&quot;utf-8&quot;) as f:\n    contenido = f.read()\nprint(contenido)\nprint(f.closed)<\/pre>\n<h2>Leer<\/h2>\n<table>\n<thead>\n<tr>\n<th>Método<\/th>\n<th>Devuelve<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>f.read()<\/code><\/td>\n<td>todo el archivo en un solo str<\/td>\n<\/tr>\n<tr>\n<td><code>f.readline()<\/code><\/td>\n<td>la siguiente línea (con el <code>\\n<\/code>); <code>\"\"<\/code> al llegar al final<\/td>\n<\/tr>\n<tr>\n<td><code>f.readlines()<\/code><\/td>\n<td>lista con todas las líneas (cada una con su <code>\\n<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>for linea in f:<\/code><\/td>\n<td>recorre línea por línea <strong>sin cargar todo en memoria<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre class=\"py\">with open(&quot;notas.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    primera = f.readline()\n    resto = f.readlines()\nprint(repr(primera))\nprint(resto)\n\ntotal = 0\nwith open(&quot;notas.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    for linea in f:\n        nombre, nota = linea.strip().split(&quot;,&quot;)\n        total += int(nota)\nprint(&quot;Total:&quot;, total)<\/pre>\n<blockquote>\n<p><strong>Ojo en el parcial:<\/strong> cada línea trae el <code>\\n<\/code> al final. Usá <code>strip()<\/code> antes de <code>split(\",\")<\/code>, y convertí con <code>int()<\/code> o <code>float()<\/code>: todo lo que se lee de un archivo es <code>str<\/code>.<\/p>\n<\/blockquote>\n<h2>Escribir<\/h2>\n<p><code>write(str)<\/code> escribe un texto (no agrega <code>\\n<\/code>, y sólo acepta <code>str<\/code>). <code>writelines(lista)<\/code> escribe varias cadenas seguidas (tampoco agrega <code>\\n<\/code>).<\/p>\n<pre class=\"py\">nombres = [&quot;Ana&quot;, &quot;Franco&quot;, &quot;Pedro&quot;]\nwith open(&quot;curso.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n    for n in nombres:\n        f.write(n + &quot;\\n&quot;)\n    f.writelines([&quot;Lucía\\n&quot;, &quot;Macarena\\n&quot;])\nwith open(&quot;curso.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    print(f.read())<\/pre>\n<h2>Archivos grandes: procesar línea por línea<\/h2>\n<p>Con <code>for linea in f<\/code> se lee de a una línea: sirve aunque el archivo pese gigas.<\/p>\n<pre class=\"py\">with open(&quot;latencias.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    for linea in f:\n        servidor, region, ms, estado = linea.strip().split(&quot;-&quot;)\n        if estado == &quot;FAIL&quot;:\n            print(&quot;Caído:&quot;, region)<\/pre>\n<h2>Errores al abrir<\/h2>\n<pre class=\"py\">try:\n    with open(&quot;no_existe.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print(&quot;El archivo no existe&quot;)<\/pre>\n<h2>Leer un archivo y escribir otro<\/h2>\n<p>Patrón muy pedido: recorrer un archivo, filtrar o calcular, y guardar el resultado en otro archivo. Se pueden abrir los dos en el mismo <code>with<\/code>.<\/p>\n<pre class=\"py\">with open(&quot;notas.txt&quot;, encoding=&quot;utf-8&quot;) as entrada, open(&quot;aprobados.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as salida:\n    for linea in entrada:\n        nombre, nota = linea.strip().split(&quot;,&quot;)\n        if int(nota) &gt;= 7:\n            salida.write(f&quot;{nombre}: {nota}\\n&quot;)\nwith open(&quot;aprobados.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    print(f.read())<\/pre>\n<h2>Registros con separador<\/h2>\n<p>Cada línea suele ser un <strong>registro<\/strong> y cada dato un <strong>campo<\/strong>, separados por un carácter (<code>,<\/code>, <code>;<\/code>, <code>-<\/code>, <code>|<\/code>). Para leerlos: <code>strip()<\/code> y después <code>split(separador)<\/code>. Para escribirlos: armar el texto con <code>separador.join(...)<\/code> (todos los campos tienen que ser <code>str<\/code>) y agregar el <code>\\n<\/code>.<\/p>\n<pre class=\"py\">registro = [&quot;Pérez&quot;, &quot;Juan&quot;, 35]\nlinea = &quot;;&quot;.join(str(c) for c in registro) + &quot;\\n&quot;\nprint(repr(linea))\napellido, nombre, edad = linea.strip().split(&quot;;&quot;)\nprint(apellido, nombre, int(edad) + 1)<\/pre>", "exercises": [{"id": "ar1", "kind": "predecir", "title": "w y a", "level": 1, "prompt": "<p>Como la pregunta 17 del simulacro.<\/p>", "code": "archivo = open(\"notas.txt\", \"w\")\narchivo.write(\"Ana,8\\n\")\narchivo.write(\"Luis,6\\n\")\narchivo.close()\narchivo = open(\"notas.txt\", \"a\")\narchivo.write(\"Mora,9\\n\")\narchivo.close()\narchivo = open(\"notas.txt\", \"w\")\narchivo.write(\"Juan,7\\n\")\narchivo.close()\nwith open(\"notas.txt\") as f:\n    print(f.read())", "explain": "<p>Después de los dos primeros bloques el archivo tiene tres líneas. Pero el último <code>open<\/code> en modo <code>\"w\"<\/code> <strong>vacía<\/strong> el archivo antes de escribir, así que sólo queda <code>Juan,7<\/code>.<\/p>"}, {"id": "ar2", "kind": "predecir", "title": "readline y readlines", "level": 2, "prompt": "<p>El archivo <code>datos.txt<\/code> existe con este contenido:<\/p>", "files": {"datos.txt": "uno\ndos\ntres\n"}, "code": "with open(\"datos.txt\") as f:\n    a = f.readline()\n    b = f.readline().strip()\n    c = f.readlines()\nprint(repr(a))\nprint(b)\nprint(c)\nprint(len(open(\"datos.txt\").read()))", "explain": "<p><code>readline<\/code> devuelve la línea <strong>con<\/strong> el <code>\\n<\/code>. La segunda se limpia con <code>strip<\/code>. <code>readlines<\/code> devuelve lo que <strong>queda<\/strong> (el archivo ya avanzó dos líneas). El archivo completo tiene 3 + 1 + 3 + 1 + 4 + 1 = 13 caracteres.<\/p>"}, {"id": "ar3", "kind": "escribir", "title": "Promedio desde un archivo", "level": 1, "prompt": "<p>Escribí <code>promedio_archivo(ruta)<\/code> que lea un archivo con líneas <code>nombre,nota<\/code> y devuelva el promedio de las notas redondeado a 2 decimales. Si el archivo no existe, devolver <code>-1<\/code>. Si está vacío, devolver <code>0<\/code>.<\/p>", "files": {"notas.txt": "Ana,8\nLuis,6\nMora,9\n", "vacio.txt": ""}, "starter": "def promedio_archivo(ruta):\n    pass\n\n\nprint(promedio_archivo(\"notas.txt\"))", "solution": "def promedio_archivo(ruta):\n    try:\n        suma = 0\n        cant = 0\n        with open(ruta, encoding=\"utf-8\") as f:\n            for linea in f:\n                nombre, nota = linea.strip().split(\",\")\n                suma += int(nota)\n                cant += 1\n        return round(suma / cant, 2) if cant > 0 else 0\n    except FileNotFoundError:\n        return -1\n\n\nprint(promedio_archivo(\"notas.txt\"))", "tests": [{"call": "promedio_archivo('notas.txt')", "expect": "7.67"}, {"call": "promedio_archivo('no_existe.txt')", "expect": "-1"}, {"call": "promedio_archivo('vacio.txt')", "expect": "0"}]}, {"id": "ar4", "kind": "escribir", "title": "Clasificar apellidos", "level": 2, "prompt": "<p><em>(TP 7, ejercicio 1)<\/em> El archivo <code>personas.txt<\/code> tiene líneas <code>Apellido, Nombre<\/code>. Escribí <code>clasificar(ruta)<\/code> que guarde en <code>ARMENIA.TXT<\/code> a quienes tienen apellido terminado en <strong>IAN<\/strong>, en <code>ITALIA.TXT<\/code> a los terminados en <strong>INI<\/strong> y en <code>ESPAÑA.TXT<\/code> a los terminados en <strong>EZ<\/strong> (sin distinguir mayúsculas). El resto se descarta. Cada línea se guarda igual que en el original. Devolver la cantidad de descartados.<\/p>", "files": {"personas.txt": "Arslanian, Gustavo\nRossini, Giuseppe\nPérez, Juan\nSmith, John\nKasparian, Lucía\nBellini, Ana\nGómez, Marta\n"}, "starter": "def clasificar(ruta):\n    pass\n\n\nprint(clasificar(\"personas.txt\"))", "solution": "def clasificar(ruta):\n    descartados = 0\n    with open(ruta, encoding=\"utf-8\") as entrada, \\\n         open(\"ARMENIA.TXT\", \"w\", encoding=\"utf-8\") as arm, \\\n         open(\"ITALIA.TXT\", \"w\", encoding=\"utf-8\") as ita, \\\n         open(\"ESPAÑA.TXT\", \"w\", encoding=\"utf-8\") as esp:\n        for linea in entrada:\n            apellido = linea.split(\",\")[0].strip().upper()\n            if apellido.endswith(\"IAN\"):\n                arm.write(linea)\n            elif apellido.endswith(\"INI\"):\n                ita.write(linea)\n            elif apellido.endswith(\"EZ\"):\n                esp.write(linea)\n            else:\n                descartados += 1\n    return descartados\n\n\nprint(clasificar(\"personas.txt\"))", "tests": [{"pre": "r = clasificar('personas.txt')", "call": "r", "label": "devuelve la cantidad de descartados", "expect": "1"}, {"call": "open('ARMENIA.TXT', encoding='utf-8').read()", "label": "contenido de ARMENIA.TXT", "expect": "'Arslanian, Gustavo\\nKasparian, Lucía\\n'"}, {"call": "open('ITALIA.TXT', encoding='utf-8').read()", "label": "contenido de ITALIA.TXT", "expect": "'Rossini, Giuseppe\\nBellini, Ana\\n'"}, {"call": "open('ESPAÑA.TXT', encoding='utf-8').read()", "label": "contenido de ESPAÑA.TXT", "expect": "'Pérez, Juan\\nGómez, Marta\\n'"}], "hint": "<p>Separá el apellido con <code>split(\",\")[0]<\/code> y usá <code>upper().endswith(...)<\/code>.<\/p>"}, {"id": "ar5", "kind": "completar", "title": "Contar líneas y palabras", "level": 1, "prompt": "<p><code>contar(ruta)<\/code> devuelve una tupla <code>(lineas, palabras)<\/code> recorriendo el archivo línea por línea.<\/p>", "files": {"frases.txt": "Hola mundo\nPython es lindo\n\nfin\n"}, "starter": "def contar(ruta):\n    lineas = 0\n    palabras = 0\n    with ___(ruta, \"___\", encoding=\"utf-8\") as f:\n        for linea in ___:\n            lineas += 1\n            palabras += len(linea.___())\n    return lineas, palabras\n\n\nprint(contar(\"frases.txt\"))", "solution": "def contar(ruta):\n    lineas = 0\n    palabras = 0\n    with open(ruta, \"r\", encoding=\"utf-8\") as f:\n        for linea in f:\n            lineas += 1\n            palabras += len(linea.split())\n    return lineas, palabras\n\n\nprint(contar(\"frases.txt\"))", "tests": [{"call": "contar('frases.txt')", "expect": "(4, 6)"}]}, {"id": "ar6", "kind": "corregir", "title": "Agregar notas al archivo", "level": 2, "prompt": "<p><code>agregar_nota(ruta, nombre, nota)<\/code> debe <strong>agregar<\/strong> al final del archivo una línea <code>nombre,nota<\/code> (con su salto de línea), sin borrar lo que ya había. Hay <strong>tres errores<\/strong>.<\/p>", "files": {"notas.txt": "Ana,8\nLuis,6\n"}, "starter": "def agregar_nota(ruta, nombre, nota):\n    with open(ruta, \"w\", encoding=\"utf-8\") as f:\n        f.write(nombre + \",\")\n        f.write(nota)\n\n\nagregar_nota(\"notas.txt\", \"Mora\", 9)\nprint(open(\"notas.txt\", encoding=\"utf-8\").read())", "solution": "def agregar_nota(ruta, nombre, nota):\n    with open(ruta, \"a\", encoding=\"utf-8\") as f:\n        f.write(nombre + \",\" + str(nota) + \"\\n\")\n\n\nagregar_nota(\"notas.txt\", \"Mora\", 9)\nprint(open(\"notas.txt\", encoding=\"utf-8\").read())", "tests": [{"pre": "agregar_nota('notas.txt', 'Mora', 9)\nagregar_nota('notas.txt', 'Juan', 7)", "call": "open('notas.txt', encoding='utf-8').read()", "label": "después de agregar Mora,9 y Juan,7", "fresh": true, "expect": "'Ana,8\\nLuis,6\\nMora,9\\nJuan,7\\n'"}], "explain": "<p>1) <code>\"w\"<\/code> borra el contenido: para agregar es <code>\"a\"<\/code>. 2) <code>write<\/code> sólo acepta <code>str<\/code>: hay que convertir la nota con <code>str()<\/code> (si no, <code>TypeError<\/code>). 3) Falta el <code>\\n<\/code> al final de la línea.<\/p>"}, {"id": "ar7", "kind": "escribir", "title": "Alturas de atletas", "level": 3, "prompt": "<p><em>(TP 7, ejercicio 3)<\/em> <code>alturas.txt<\/code> tiene el nombre de un deporte en una línea y, debajo, las alturas de sus atletas (una por línea), y así con cada deporte. Escribí:<\/p>\n<ul>\n<li><code>grabar_promedios(entrada, salida)<\/code>: graba en <code>salida<\/code> el nombre de cada deporte y, en la línea siguiente, el promedio de sus alturas con 2 decimales (<code>f\"{prom:.2f}\"<\/code>). Devuelve la cantidad de deportes.<\/li>\n<li><code>mas_altos(ruta_promedios)<\/code>: leyendo <strong>el archivo de promedios<\/strong>, devuelve la lista de deportes cuyo promedio supera el promedio de todos los promedios.<\/li>\n<\/ul>\n<p>Para saber si una línea es un deporte o una altura, probá convertirla con <code>float()<\/code> y capturá el <code>ValueError<\/code>.<\/p>", "files": {"alturas.txt": "Básquet\n1.95\n2.01\n1.88\nVóley\n1.90\n1.86\nNatación\n1.80\n"}, "starter": "def grabar_promedios(entrada, salida):\n    pass\n\n\ndef mas_altos(ruta_promedios):\n    pass\n\n\nprint(grabar_promedios(\"alturas.txt\", \"promedios.txt\"))\nprint(open(\"promedios.txt\", encoding=\"utf-8\").read())\nprint(mas_altos(\"promedios.txt\"))", "solution": "def grabar_promedios(entrada, salida):\n    deportes = 0\n    deporte = None\n    suma = 0\n    cant = 0\n    with open(entrada, encoding=\"utf-8\") as fe, open(salida, \"w\", encoding=\"utf-8\") as fs:\n        for linea in fe:\n            linea = linea.strip()\n            if linea == \"\":\n                continue\n            try:\n                suma += float(linea)\n                cant += 1\n            except ValueError:\n                if deporte is not None:\n                    fs.write(f\"{deporte}\\n{suma / cant:.2f}\\n\")\n                deporte = linea\n                deportes += 1\n                suma = 0\n                cant = 0\n        if deporte is not None:\n            fs.write(f\"{deporte}\\n{suma / cant:.2f}\\n\")\n    return deportes\n\n\ndef mas_altos(ruta_promedios):\n    with open(ruta_promedios, encoding=\"utf-8\") as f:\n        lineas = [l.strip() for l in f if l.strip() != \"\"]\n    deportes = lineas[0::2]\n    promedios = [float(x) for x in lineas[1::2]]\n    general = sum(promedios) / len(promedios)\n    return [d for d, p in zip(deportes, promedios) if p > general]\n\n\nprint(grabar_promedios(\"alturas.txt\", \"promedios.txt\"))\nprint(open(\"promedios.txt\", encoding=\"utf-8\").read())\nprint(mas_altos(\"promedios.txt\"))", "tests": [{"pre": "r = grabar_promedios('alturas.txt', 'promedios.txt')", "call": "r", "label": "cantidad de deportes", "fresh": true, "expect": "3"}, {"call": "open('promedios.txt', encoding='utf-8').read()", "label": "contenido de promedios.txt", "expect": "'Básquet\\n1.95\\nVóley\\n1.88\\nNatación\\n1.80\\n'"}, {"call": "mas_altos('promedios.txt')", "label": "deportes por encima del promedio general", "expect": "['Básquet', 'Vóley']"}], "hint": "<p>Guardá el deporte actual, la suma y la cantidad. Cuando aparece un deporte nuevo, grabá el anterior. No te olvides de grabar el último al terminar el ciclo.<\/p>"}, {"id": "ar8", "kind": "escribir", "title": "Latencias por región", "level": 3, "prompt": "<p><em>(Ejemplo de la clase)<\/em> <code>latencias.txt<\/code> tiene líneas <code>Server-REGION-MS-ESTADO<\/code>. Escribí <code>resumen(ruta)<\/code> que devuelva una tupla <code>(promedios, caidos)<\/code>:<\/p>\n<ul>\n<li><code>promedios<\/code>: diccionario <code>{region: promedio de ms}<\/code> <strong>sólo de las líneas OK<\/strong>, redondeado a 1 decimal.<\/li>\n<li><code>caidos<\/code>: lista de regiones con estado <code>FAIL<\/code>, en el orden en que aparecen.<\/li>\n<\/ul>\n<p>Procesá el archivo línea por línea.<\/p>", "files": {"latencias.txt": "Server-LATAM-120-OK\nServer-USEast-45-OK\nServer-EUWest-310-OK\nServer-LATAM-0-FAIL\nServer-USEast-400-OK\nServer-ASIA-0-FAIL\nServer-LATAM-85-OK\nServer-EUWest-90-OK\n"}, "starter": "def resumen(ruta):\n    pass\n\n\nprint(resumen(\"latencias.txt\"))", "solution": "def resumen(ruta):\n    sumas = {}\n    cants = {}\n    caidos = []\n    with open(ruta, encoding=\"utf-8\") as f:\n        for linea in f:\n            _, region, ms, estado = linea.strip().split(\"-\")\n            if estado == \"OK\":\n                sumas[region] = sumas.get(region, 0) + int(ms)\n                cants[region] = cants.get(region, 0) + 1\n            else:\n                caidos.append(region)\n    promedios = {r: round(sumas[r] / cants[r], 1) for r in sumas}\n    return promedios, caidos\n\n\nprint(resumen(\"latencias.txt\"))", "tests": [{"call": "resumen('latencias.txt')", "expect": "({'LATAM': 102.5, 'USEast': 222.5, 'EUWest': 200.0}, ['LATAM', 'ASIA'])"}]}]}, {"id": "json", "num": 12, "title": "Archivos JSON", "summary": "Equivalencias JSON-Python, dumps/loads, dump/load, indent y ensure_ascii, y el patrón leer-modificar-guardar.", "theory": "<h2>Qué es JSON<\/h2>\n<p>Un formato de <strong>texto<\/strong> estándar para guardar e intercambiar datos estructurados. Se parece mucho a los diccionarios y listas de Python, con reglas más estrictas.<\/p>\n<table>\n<thead>\n<tr>\n<th>JSON<\/th>\n<th>Python<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>objeto <code>{\"clave\": valor}<\/code><\/td>\n<td><code>dict<\/code><\/td>\n<\/tr>\n<tr>\n<td>arreglo <code>[...]<\/code><\/td>\n<td><code>list<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>\"texto\"<\/code><\/td>\n<td><code>str<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>10<\/code>, <code>3.5<\/code><\/td>\n<td><code>int<\/code>, <code>float<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>true<\/code> / <code>false<\/code><\/td>\n<td><code>True<\/code> / <code>False<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>null<\/code><\/td>\n<td><code>None<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Reglas: las claves van <strong>siempre entre comillas dobles<\/strong>; no hay comillas simples, tuplas, conjuntos ni comentarios; no puede quedar una coma al final.<\/p>\n<h2>Las cuatro funciones (la \"s\" es de string)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Función<\/th>\n<th>Convierte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>json.dumps(obj)<\/code><\/td>\n<td>Python → <strong>str<\/strong> JSON<\/td>\n<\/tr>\n<tr>\n<td><code>json.loads(texto)<\/code><\/td>\n<td><strong>str<\/strong> JSON → Python<\/td>\n<\/tr>\n<tr>\n<td><code>json.dump(obj, archivo)<\/code><\/td>\n<td>Python → <strong>archivo<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>json.load(archivo)<\/code><\/td>\n<td><strong>archivo<\/strong> → Python<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre class=\"py\">import json\nalumno = {&quot;nombre&quot;: &quot;Martín Núñez&quot;, &quot;notas&quot;: [8, 9], &quot;activo&quot;: True, &quot;beca&quot;: None}\ntexto = json.dumps(alumno)\nprint(type(texto), texto)\nprint(json.dumps(alumno, ensure_ascii=False, indent=4))\nde_vuelta = json.loads(texto)\nprint(type(de_vuelta), de_vuelta[&quot;notas&quot;][0])<\/pre>\n<ul>\n<li><code>indent=4<\/code>: sangría para que sea legible.<\/li>\n<li><code>ensure_ascii=False<\/code>: conserva las tildes y la ñ (si no, <code>á<\/code> se guarda como <code>á<\/code>).<\/li>\n<li><code>sort_keys=True<\/code>: ordena las claves.<\/li>\n<\/ul>\n<p>En la materia se usa siempre <code>ensure_ascii=False, indent=4<\/code> y <code>encoding=\"UTF-8\"<\/code>.<\/p>\n<h2>La ida y vuelta no siempre es idéntica<\/h2>\n<pre class=\"py\">import json\nprint(json.loads(json.dumps({1: &quot;a&quot;})))      # las claves pasan a str\nprint(json.loads(json.dumps((1, 2))))        # las tuplas pasan a lista\ntry:\n    json.dumps({1, 2})                       # los conjuntos no se pueden\nexcept TypeError as e:\n    print(&quot;TypeError:&quot;, e)\nprint(json.dumps(sorted({3, 1, 2})))         # convertirlos antes<\/pre>\n<blockquote>\n<p><strong>Ojo en el parcial:<\/strong> después de cargar <code>{\"1\": ...}<\/code>, <code>datos[1]<\/code> da <code>KeyError<\/code>: hay que usar <code>datos[\"1\"]<\/code> o <code>datos[str(id)]<\/code>.<\/p>\n<\/blockquote>\n<h2>Leer y guardar archivos<\/h2>\n<pre class=\"py\">import json\nwith open(&quot;productos.json&quot;, &quot;r&quot;, encoding=&quot;UTF-8&quot;) as f:\n    productos = json.load(f)\nfor id_prod, p in productos.items():\n    print(f&quot;[{id_prod}] {p[&#x27;nombre&#x27;]:&lt;18} ${p[&#x27;precio&#x27;]}&quot;)\n\nwith open(&quot;copia.json&quot;, &quot;w&quot;, encoding=&quot;UTF-8&quot;) as f:\n    json.dump(productos, f, ensure_ascii=False, indent=4)<\/pre>\n<h2>El patrón leer → modificar → guardar (CRUD)<\/h2>\n<p>Para dar de alta, modificar o borrar datos de un JSON:<\/p>\n<ol>\n<li><strong>Leer<\/strong> todo el archivo con <code>\"r\"<\/code> y <code>json.load<\/code>.<\/li>\n<li><strong>Modificar<\/strong> los datos en memoria (listas o diccionarios).<\/li>\n<li><strong>Sobrescribir<\/strong> el archivo con <code>\"w\"<\/code> y <code>json.dump<\/code>.<\/li>\n<\/ol>\n<pre class=\"py\">import json\nwith open(&quot;productos.json&quot;, encoding=&quot;UTF-8&quot;) as f:          # 1. leer\n    productos = json.load(f)\n\nnuevo_id = str(max(int(k) for k in productos) + 1)            # 2. modificar\nproductos[nuevo_id] = {&quot;nombre&quot;: &quot;Yerba mate&quot;, &quot;marca&quot;: &quot;Taragüí&quot;,\n                       &quot;presentacion&quot;: &quot;Paq. 1 kg&quot;, &quot;precio&quot;: 4500}\nproductos.pop(&quot;2&quot;, None)\n\nwith open(&quot;productos.json&quot;, &quot;w&quot;, encoding=&quot;UTF-8&quot;) as f:     # 3. guardar\n    json.dump(productos, f, ensure_ascii=False, indent=4)\nprint(list(productos.keys()))<\/pre>\n<blockquote>\n<p><strong>Ojo:<\/strong> abrir con <code>\"w\"<\/code> <strong>vacía<\/strong> el archivo en ese mismo momento. Si lo abrís con <code>\"w\"<\/code> para leer, perdés los datos. Y olvidarse del paso 3 es el error más común: los cambios se pierden al cerrar el programa.<\/p>\n<\/blockquote>\n<h2>Errores típicos<\/h2>\n<table>\n<thead>\n<tr>\n<th>Excepción<\/th>\n<th>Cuándo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>FileNotFoundError<\/code><\/td>\n<td>la ruta no existe (al leer)<\/td>\n<\/tr>\n<tr>\n<td><code>json.JSONDecodeError<\/code><\/td>\n<td>el archivo está vacío o no es JSON válido<\/td>\n<\/tr>\n<tr>\n<td><code>TypeError<\/code><\/td>\n<td>intentar guardar algo no serializable (un <code>set<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>KeyError<\/code><\/td>\n<td>acceder a una clave que no está (por ejemplo, <code>int<\/code> en vez de <code>str<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre class=\"py\">import json\ndef cargar(ruta):\n    try:\n        with open(ruta, encoding=&quot;UTF-8&quot;) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        print(&quot;No existe:&quot;, ruta)\n    except json.JSONDecodeError as e:\n        print(&quot;JSON inválido:&quot;, e)\n    return None\n\nprint(cargar(&quot;productos.json&quot;) is not None)\ncargar(&quot;no_existe.json&quot;)\ncargar(&quot;roto.json&quot;)<\/pre>", "exercises": [{"id": "js1", "kind": "predecir", "title": "dumps y loads", "level": 1, "prompt": "<p>Las preguntas del repaso de la clase de JSON.<\/p>", "code": "import json\nprint(type(json.dumps({\"a\": 1})))\nprint(json.loads('{\"activo\": true, \"x\": null}'))\nd = json.loads(json.dumps({1: \"a\"}))\nprint(d)\nprint(json.dumps((1, 2)))\nprint(json.dumps({\"país\": \"Perú\"}))", "explain": "<p><code>dumps<\/code> siempre devuelve un <code>str<\/code>. <code>true<\/code> y <code>null<\/code> se convierten en <code>True<\/code> y <code>None<\/code>. La clave <code>1<\/code> vuelve como <code>\"1\"<\/code>. La tupla se guarda como arreglo <code>[1, 2]<\/code>. Sin <code>ensure_ascii=False<\/code>, las letras con tilde se escriben como <code>\\u00ed<\/code> y <code>\\u00fa<\/code>.<\/p>"}, {"id": "js2", "kind": "predecir", "title": "JSON inválido y conjuntos", "level": 2, "prompt": "<p>Todo está dentro de <code>try<\/code>, así que no se corta.<\/p>", "code": "import json\nfor texto in ['{\"a\": 1}', \"{'a': 1}\", \"\", \"[1, 2,]\"]:\n    try:\n        print(json.loads(texto))\n    except json.JSONDecodeError:\n        print(\"inválido:\", repr(texto))\ntry:\n    json.dumps({\"tags\": {1, 2}})\nexcept TypeError:\n    print(\"set no serializable\")", "explain": "<p>Sólo el primero es JSON válido. Con comillas simples, vacío y con coma final, <code>loads<\/code> lanza <code>JSONDecodeError<\/code>. Un conjunto no se puede convertir a JSON: <code>TypeError<\/code>.<\/p>"}, {"id": "js3", "kind": "escribir", "title": "Carga robusta", "level": 2, "prompt": "<p>Escribí <code>cargar_json(ruta, defecto)<\/code> que devuelva lo que hay en el archivo JSON. Si el archivo no existe <strong>o<\/strong> está vacío o mal formado, devolver <code>defecto<\/code>.<\/p>", "files": {"paises.json": "[\n    {\"id\": 1, \"nombre\": \"Argentina\"},\n    {\"id\": 2, \"nombre\": \"Uruguay\"},\n    {\"id\": 5, \"nombre\": \"Perú\"}\n]\n", "roto.json": "{'a': 1,}\n", "vacio.json": ""}, "starter": "import json\n\n\ndef cargar_json(ruta, defecto):\n    pass\n\n\nprint(cargar_json(\"paises.json\", []))\nprint(cargar_json(\"roto.json\", {}))", "solution": "import json\n\n\ndef cargar_json(ruta, defecto):\n    try:\n        with open(ruta, \"r\", encoding=\"UTF-8\") as f:\n            return json.load(f)\n    except (FileNotFoundError, json.JSONDecodeError):\n        return defecto\n\n\nprint(cargar_json(\"paises.json\", []))\nprint(cargar_json(\"roto.json\", {}))", "tests": [{"call": "cargar_json('paises.json', [])", "expect": "[{'id': 1, 'nombre': 'Argentina'}, {'id': 2, 'nombre': 'Uruguay'}, {'id': 5, 'nombre': 'Perú'}]"}, {"call": "cargar_json('roto.json', {})", "expect": "{}"}, {"call": "cargar_json('vacio.json', [])", "expect": "[]"}, {"call": "cargar_json('no_existe.json', 'nada')", "expect": "'nada'"}]}, {"id": "js4", "kind": "completar", "title": "Guardar JSON", "level": 1, "prompt": "<p><code>guardar_json(ruta, datos)<\/code> guarda los datos con tildes legibles y sangría 4, y devuelve <code>True<\/code>. Si los datos no se pueden serializar (por ejemplo, tienen un <code>set<\/code>), devuelve <code>False<\/code>.<\/p>", "starter": "import json\n\n\ndef guardar_json(ruta, datos):\n    try:\n        texto = json.___(datos, ensure_ascii=___, indent=___)\n    except ___:\n        return False\n    with open(ruta, \"___\", encoding=\"UTF-8\") as f:\n        f.write(texto)\n    return True\n\n\nprint(guardar_json(\"salida.json\", {\"país\": \"Perú\", \"notas\": [8, 9]}))\nprint(open(\"salida.json\", encoding=\"UTF-8\").read())", "solution": "import json\n\n\ndef guardar_json(ruta, datos):\n    try:\n        texto = json.dumps(datos, ensure_ascii=False, indent=4)\n    except TypeError:\n        return False\n    with open(ruta, \"w\", encoding=\"UTF-8\") as f:\n        f.write(texto)\n    return True\n\n\nprint(guardar_json(\"salida.json\", {\"país\": \"Perú\", \"notas\": [8, 9]}))\nprint(open(\"salida.json\", encoding=\"UTF-8\").read())", "tests": [{"call": "guardar_json('salida.json', {'país': 'Perú', 'notas': [8, 9]})", "expect": "True"}, {"call": "open('salida.json', encoding='UTF-8').read()", "label": "contenido de salida.json", "expect": "'{\\n    \"país\": \"Perú\",\\n    \"notas\": [\\n        8,\\n        9\\n    ]\\n}'"}, {"call": "guardar_json('mal.json', {'x': {1, 2}})", "expect": "False"}], "hint": "<p>Se usa <code>dumps<\/code> (a texto) para que, si falla, no quede un archivo a medio escribir.<\/p>"}, {"id": "js5", "kind": "escribir", "title": "Agregar un país", "level": 2, "prompt": "<p><code>paises.json<\/code> es una lista de objetos <code>{\"id\", \"nombre\"}<\/code>. Escribí <code>agregar_pais(ruta, nombre)<\/code> con el patrón leer → modificar → guardar:<\/p>\n<ul>\n<li>Si el país ya existe (sin distinguir mayúsculas), no agregar y devolver <code>False<\/code>.<\/li>\n<li>Si no, agregarlo con <code>id<\/code> = mayor id + 1, guardar el archivo (con <code>ensure_ascii=False, indent=4<\/code>) y devolver <code>True<\/code>.<\/li>\n<\/ul>", "files": {"paises.json": "[\n    {\"id\": 1, \"nombre\": \"Argentina\"},\n    {\"id\": 2, \"nombre\": \"Uruguay\"},\n    {\"id\": 5, \"nombre\": \"Perú\"}\n]\n"}, "starter": "import json\n\n\ndef agregar_pais(ruta, nombre):\n    pass\n\n\nprint(agregar_pais(\"paises.json\", \"chile\"))\nprint(agregar_pais(\"paises.json\", \"ARGENTINA\"))\nprint(open(\"paises.json\", encoding=\"UTF-8\").read())", "solution": "import json\n\n\ndef agregar_pais(ruta, nombre):\n    with open(ruta, \"r\", encoding=\"UTF-8\") as f:\n        paises = json.load(f)\n    for p in paises:\n        if p[\"nombre\"].lower() == nombre.lower():\n            return False\n    nuevo_id = max(p[\"id\"] for p in paises) + 1\n    paises.append({\"id\": nuevo_id, \"nombre\": nombre})\n    with open(ruta, \"w\", encoding=\"UTF-8\") as f:\n        json.dump(paises, f, ensure_ascii=False, indent=4)\n    return True\n\n\nprint(agregar_pais(\"paises.json\", \"chile\"))\nprint(agregar_pais(\"paises.json\", \"ARGENTINA\"))\nprint(open(\"paises.json\", encoding=\"UTF-8\").read())", "tests": [{"pre": "r = agregar_pais('paises.json', 'Chile')", "call": "r", "label": "agregar Chile → True", "fresh": true, "expect": "True"}, {"call": "json.load(open('paises.json', encoding='UTF-8'))", "label": "el archivo quedó con Chile y id 6", "expect": "[{'id': 1, 'nombre': 'Argentina'}, {'id': 2, 'nombre': 'Uruguay'}, {'id': 5, 'nombre': 'Perú'}, {'id': 6, 'nombre': 'Chile'}]"}, {"call": "agregar_pais('paises.json', 'uruguay')", "label": "agregar 'uruguay' (ya existe) → False", "expect": "False"}, {"call": "len(json.load(open('paises.json', encoding='UTF-8')))", "label": "no se duplicó", "expect": "4"}]}, {"id": "js6", "kind": "corregir", "title": "Aumento de precios por marca", "level": 2, "prompt": "<p><code>aumentar_precios(ruta, marca, porcentaje)<\/code> debe aumentar, <strong>sin distinguir mayúsculas en la marca<\/strong>, el precio de los productos de esa marca (redondeado a entero), guardar el archivo y devolver cuántos productos cambió. Hay <strong>tres errores<\/strong>. Uno de ellos, además, borra el archivo: mirá los archivos después de ejecutar.<\/p>", "files": {"productos.json": "{\n    \"1\": {\"nombre\": \"Fideos tirabuzón\", \"marca\": \"Lucchetti\", \"presentacion\": \"Paq. 500 g\", \"precio\": 1500},\n    \"2\": {\"nombre\": \"Arroz largo fino\", \"marca\": \"Gallo\", \"presentacion\": \"Paq. 1 kg\", \"precio\": 1800},\n    \"3\": {\"nombre\": \"Lentejas secas\", \"marca\": \"Lucchetti\", \"presentacion\": \"Paq. 500 g\", \"precio\": 2100},\n    \"4\": {\"nombre\": \"Avena\", \"marca\": \"Quaker\", \"presentacion\": \"Paq. 1 kg\", \"precio\": 1900},\n    \"5\": {\"nombre\": \"Polenta\", \"marca\": \"Presto Pronta\", \"presentacion\": \"Paq. 500 g\", \"precio\": 1600}\n}\n"}, "starter": "import json\n\n\ndef aumentar_precios(ruta, marca, porcentaje):\n    with open(ruta, \"w\", encoding=\"UTF-8\") as f:\n        productos = json.load(f)\n    cant = 0\n    for id_prod, p in productos.items():\n        if p[\"marca\"] == marca:\n            p[\"precio\"] = round(p[\"precio\"] * (1 + porcentaje / 100))\n            cant += 1\n    return cant\n\n\nprint(aumentar_precios(\"productos.json\", \"lucchetti\", 10))", "solution": "import json\n\n\ndef aumentar_precios(ruta, marca, porcentaje):\n    with open(ruta, \"r\", encoding=\"UTF-8\") as f:\n        productos = json.load(f)\n    cant = 0\n    for id_prod, p in productos.items():\n        if p[\"marca\"].lower() == marca.lower():\n            p[\"precio\"] = round(p[\"precio\"] * (1 + porcentaje / 100))\n            cant += 1\n    with open(ruta, \"w\", encoding=\"UTF-8\") as f:\n        json.dump(productos, f, ensure_ascii=False, indent=4)\n    return cant\n\n\nprint(aumentar_precios(\"productos.json\", \"lucchetti\", 10))", "tests": [{"pre": "r = aumentar_precios('productos.json', 'lucchetti', 10)", "call": "r", "label": "cambia 2 productos", "fresh": true, "expect": "2"}, {"call": "[p['precio'] for p in json.load(open('productos.json', encoding='UTF-8')).values()]", "label": "precios guardados en el archivo", "expect": "[1650, 1800, 2310, 1900, 1600]"}], "explain": "<p>1) Se abría con <code>\"w\"<\/code> para leer: eso vacía el archivo y además no se puede leer (<code>UnsupportedOperation<\/code>). 2) La marca se comparaba distinguiendo mayúsculas. 3) Faltaba el paso de guardar con <code>json.dump<\/code>, así que los cambios se perdían.<\/p>"}, {"id": "js7", "kind": "escribir", "title": "Reporte de productos", "level": 2, "prompt": "<p>Con <code>productos.json<\/code> (diccionario de diccionarios, claves <code>str<\/code>), escribí:<\/p>\n<ul>\n<li><code>precio_promedio(ruta)<\/code>: promedio de precios, redondeado a 2 decimales.<\/li>\n<li><code>mas_caro(ruta)<\/code>: tupla <code>(id, nombre)<\/code> del más caro (con el id como <code>str<\/code>).<\/li>\n<li><code>por_presentacion(ruta)<\/code>: diccionario <code>{presentacion: cantidad}<\/code>.<\/li>\n<\/ul>", "files": {"productos.json": "{\n    \"1\": {\"nombre\": \"Fideos tirabuzón\", \"marca\": \"Lucchetti\", \"presentacion\": \"Paq. 500 g\", \"precio\": 1500},\n    \"2\": {\"nombre\": \"Arroz largo fino\", \"marca\": \"Gallo\", \"presentacion\": \"Paq. 1 kg\", \"precio\": 1800},\n    \"3\": {\"nombre\": \"Lentejas secas\", \"marca\": \"Lucchetti\", \"presentacion\": \"Paq. 500 g\", \"precio\": 2100},\n    \"4\": {\"nombre\": \"Avena\", \"marca\": \"Quaker\", \"presentacion\": \"Paq. 1 kg\", \"precio\": 1900},\n    \"5\": {\"nombre\": \"Polenta\", \"marca\": \"Presto Pronta\", \"presentacion\": \"Paq. 500 g\", \"precio\": 1600}\n}\n"}, "starter": "import json\n\n\ndef precio_promedio(ruta):\n    pass\n\n\ndef mas_caro(ruta):\n    pass\n\n\ndef por_presentacion(ruta):\n    pass\n\n\nprint(precio_promedio(\"productos.json\"))\nprint(mas_caro(\"productos.json\"))\nprint(por_presentacion(\"productos.json\"))", "solution": "import json\n\n\ndef leer(ruta):\n    with open(ruta, encoding=\"UTF-8\") as f:\n        return json.load(f)\n\n\ndef precio_promedio(ruta):\n    prods = leer(ruta)\n    return round(sum(p[\"precio\"] for p in prods.values()) / len(prods), 2)\n\n\ndef mas_caro(ruta):\n    prods = leer(ruta)\n    id_max = max(prods, key=lambda k: prods[k][\"precio\"])\n    return id_max, prods[id_max][\"nombre\"]\n\n\ndef por_presentacion(ruta):\n    cuenta = {}\n    for p in leer(ruta).values():\n        cuenta[p[\"presentacion\"]] = cuenta.get(p[\"presentacion\"], 0) + 1\n    return cuenta\n\n\nprint(precio_promedio(\"productos.json\"))\nprint(mas_caro(\"productos.json\"))\nprint(por_presentacion(\"productos.json\"))", "tests": [{"call": "precio_promedio('productos.json')", "expect": "1780.0"}, {"call": "mas_caro('productos.json')", "expect": "('3', 'Lentejas secas')"}, {"call": "por_presentacion('productos.json')", "expect": "{'Paq. 500 g': 3, 'Paq. 1 kg': 2}"}]}, {"id": "js8", "kind": "escribir", "title": "Ventas sobre stock.json", "level": 3, "prompt": "<p><em>(Ejercicio A2 de la clase)<\/em> Escribí <code>registrar_venta(ruta, item, cantidad)<\/code> que lea <code>stock.json<\/code>, valide y, <strong>sólo si la venta es válida<\/strong>, guarde el stock actualizado y devuelva lo que queda. Debe lanzar <code>KeyError<\/code> si el ítem no existe, y <code>ValueError<\/code> si la cantidad no es positiva o no alcanza el stock.<\/p>", "files": {"stock.json": "{\"item1\": 100, \"item2\": 200, \"item3\": 300}\n"}, "starter": "import json\n\n\ndef registrar_venta(ruta, item, cantidad):\n    pass\n\n\nprint(registrar_venta(\"stock.json\", \"item1\", 30))", "solution": "import json\n\n\ndef registrar_venta(ruta, item, cantidad):\n    with open(ruta, encoding=\"UTF-8\") as f:\n        stock = json.load(f)\n    if item not in stock:\n        raise KeyError(f\"no existe el ítem '{item}'\")\n    if cantidad <= 0:\n        raise ValueError(\"la cantidad debe ser positiva\")\n    if cantidad > stock[item]:\n        raise ValueError(f\"stock insuficiente (hay {stock[item]})\")\n    stock[item] -= cantidad\n    with open(ruta, \"w\", encoding=\"UTF-8\") as f:\n        json.dump(stock, f, ensure_ascii=False, indent=4)\n    return stock[item]\n\n\nprint(registrar_venta(\"stock.json\", \"item1\", 30))", "tests": [{"pre": "r = registrar_venta('stock.json', 'item1', 30)", "call": "r", "label": "vender 30 de item1 → quedan 70", "fresh": true, "expect": "70"}, {"call": "registrar_venta('stock.json', 'item9', 5)", "raises": "KeyError", "label": "item9 lanza KeyError"}, {"call": "registrar_venta('stock.json', 'item2', 250)", "raises": "ValueError", "label": "250 de item2 lanza ValueError"}, {"call": "registrar_venta('stock.json', 'item3', -4)", "raises": "ValueError", "label": "cantidad -4 lanza ValueError"}, {"call": "json.load(open('stock.json', encoding='UTF-8'))", "label": "el archivo sólo registra la venta válida", "expect": "{'item1': 70, 'item2': 200, 'item3': 300}"}]}]}], "simulacro": [{"code": "matriz = [[3, 6, 9], [12, 15, 18], [21, 24, 27]]", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>matriz[-2][-1]<\/code>?", "expr": "matriz[-2][-1]", "explain": "<p><code>matriz[-2]<\/code> es la anteúltima fila <code>[12, 15, 18]<\/code> y <code>[-1]<\/code> su último elemento.<\/p>"}, {"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>matriz[0][-3] + matriz[2][1]<\/code>?", "expr": "matriz[0][-3] + matriz[2][1]", "explain": "<p><code>matriz[0][-3]<\/code> es 3 (en una fila de 3 elementos, -3 es la posición 0) y <code>matriz[2][1]<\/code> es 24.<\/p>"}]}, {"code": "matriz = [[2, 4, 6], [1, 3, 5], [7, 8, 9]]\ntotal = 0\nfor i in range(len(matriz)):\n    for j in range(len(matriz[i])):\n        if i == j:\n            total += matriz[i][j]", "parts": [{"type": "valor", "pts": 3, "q": "¿Cuál es el valor final de <code>total<\/code>?", "expr": "total"}, {"type": "explica", "pts": 3, "q": "Explique qué elementos suma y de qué forma recorre la matriz el programa.", "model": "<p>Recorre la matriz <strong>por filas<\/strong>: el <code>for<\/code> externo avanza por las filas (<code>i<\/code>) y, para cada una, el interno recorre sus columnas (<code>j<\/code>). Sólo suma cuando <code>i == j<\/code>, es decir, los elementos de la <strong>diagonal principal<\/strong>: 2 + 3 + 9 = 14.<\/p>"}]}, {"code": "stock = {\"lapiz\": 10, \"goma\": 0}", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>stock.get(\"regla\", -1)<\/code>?", "expr": "stock.get(\"regla\", -1)"}, {"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>stock.get(\"goma\", 5)<\/code>?", "expr": "stock.get(\"goma\", 5)", "explain": "<p>La clave <code>\"goma\"<\/code> <strong>existe<\/strong>, así que <code>get<\/code> devuelve su valor (0). El valor por defecto sólo se usa cuando la clave no está.<\/p>"}]}, {"code": "alumnos = [(\"Ana\", 8), (\"Luis\", 6), (\"Mora\", 9), (\"Juan\", 6)]\norden = sorted(alumnos, key=lambda a: a[1], reverse=True)", "parts": [{"type": "valor", "pts": 2, "q": "Escriba el valor de <code>orden<\/code>.", "expr": "orden"}, {"type": "explica", "pts": 2, "q": "Luis y Juan tienen la misma nota. ¿Cuál queda primero y por qué?", "model": "<p>Queda primero <strong>Luis<\/strong>. <code>sorted<\/code> es <strong>estable<\/strong>: cuando dos elementos tienen la misma clave de orden, conservan el orden que tenían en la lista original (y eso se mantiene aunque se use <code>reverse=True<\/code>).<\/p>"}, {"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>max(alumnos, key=lambda a: a[1])[0]<\/code>?", "expr": "max(alumnos, key=lambda a: a[1])[0]"}]}, {"code": "lista = [5, 10, 15, 20, 25, 30]", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>lista[1:-1:2]<\/code>?", "expr": "lista[1:-1:2]"}, {"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>lista[::-3]<\/code>?", "expr": "lista[::-3]"}]}, {"code": "productos = [{\"cod\": 11, \"stock\": 0, \"precio\": 500},\n             {\"cod\": 12, \"stock\": 8, \"precio\": 1200},\n             {\"cod\": 13, \"stock\": 3, \"precio\": 950},\n             {\"cod\": 14, \"stock\": 15, \"precio\": 2000},\n             {\"cod\": 15, \"stock\": 6, \"precio\": 300}]\nfor p in productos:\n    if p[\"stock\"] > 0 and (p[\"precio\"] < 1000 or p[\"cod\"] % 2 == 0):\n        print(p[\"cod\"])", "parts": [{"type": "salida", "pts": 3, "q": "¿Qué imprime el código?"}, {"type": "explica", "pts": 3, "q": "Explique con precisión qué condiciones deben cumplirse para que un producto se muestre.", "model": "<p>Tiene que haber stock (<code>stock &gt; 0<\/code>) <strong>y además<\/strong> cumplirse al menos una de dos cosas: que el precio sea menor a 1000 <strong>o<\/strong> que el código sea par. Los paréntesis hacen que el <code>or<\/code> se evalúe primero. El 11 no se muestra por no tener stock; 12 (par), 13 (barato), 14 (par) y 15 (barato) sí.<\/p>"}]}, {"code": "empleados = [{\"nombre\": \"ana\", \"sueldo\": 900}, {\"nombre\": \"luis\", \"sueldo\": 1500},\n             {\"nombre\": \"mora\", \"sueldo\": 1200}, {\"nombre\": \"juan\", \"sueldo\": 2000}]\nresultado = [e[\"nombre\"].capitalize() for e in empleados if 1000 <= e[\"sueldo\"] < 2000]", "parts": [{"type": "valor", "pts": 2, "q": "Escriba lo que vale <code>resultado<\/code>.", "expr": "resultado"}, {"type": "explica", "pts": 2, "q": "Explique cómo genera Python este resultado.", "model": "<p>Es una <strong>lista por comprensión<\/strong>: recorre cada diccionario <code>e<\/code> de la lista, se queda sólo con los que cumplen <code>1000 &lt;= sueldo &lt; 2000<\/code> (comparación triple) y para cada uno agrega a la nueva lista el nombre con la primera letra en mayúscula (<code>capitalize<\/code>).<\/p>"}, {"type": "valor", "pts": 2, "q": "¿Qué valor tomaría <code>resultado<\/code> si la condición fuera <code>if e[\"sueldo\"] % 500 == 0<\/code>?", "expr": "[e[\"nombre\"].capitalize() for e in empleados if e[\"sueldo\"] % 500 == 0]"}]}, {"code": "t = ([1, 2], \"ab\", 3)", "parts": [{"type": "explica", "pts": 2, "q": "¿Qué ocurre si se ejecuta <code>t[0][0] = 9<\/code>? ¿Y si se ejecuta <code>t[1] = \"cd\"<\/code>?", "model": "<p><code>t[0][0] = 9<\/code> <strong>funciona<\/strong>: <code>t<\/code> queda <code>([9, 2], 'ab', 3)<\/code>. <code>t[1] = \"cd\"<\/code> lanza <strong><code>TypeError<\/code><\/strong> (<code>'tuple' object does not support item assignment<\/code>).<\/p>"}, {"type": "explica", "pts": 2, "q": "Explique por qué una operación es válida y la otra no.", "model": "<p>La tupla es <strong>inmutable<\/strong>: no se puede reasignar ninguno de sus elementos. Pero <code>t[0]<\/code> es una <strong>lista<\/strong>, que es mutable: <code>t[0][0] = 9<\/code> no cambia qué objeto hay en la tupla, sino el contenido de esa lista.<\/p>"}]}, {"code": "texto = \"programar,es,divertido,y,util\"\npalabras = texto.split(\",\")\npalabras.sort(key=len, reverse=True)", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué contiene la lista justo después del <code>split<\/code>?", "expr": "texto.split(\",\")"}, {"type": "valor", "pts": 2, "q": "¿Cuál es el valor de <code>palabras<\/code> luego del <code>sort<\/code>?", "expr": "palabras"}, {"type": "explica", "pts": 2, "q": "Justifique el criterio de orden.", "model": "<p><code>key=len<\/code> hace que se compare la <strong>longitud<\/strong> de cada palabra y <code>reverse=True<\/code> ordena de mayor a menor: 9, 9, 4, 2, 1. Entre <code>programar<\/code> y <code>divertido<\/code> (9 letras) queda primero <code>programar<\/code> porque el ordenamiento es estable y estaba antes en la lista.<\/p>"}]}, {"code": "texto = \"  Parcial de Python  \"\nresultado = texto.strip().upper().split(\" \")", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué valor toma <code>resultado<\/code>?", "expr": "resultado"}, {"type": "explica", "pts": 2, "q": "¿Qué hace cada uno de los tres métodos encadenados?", "model": "<p><code>strip()<\/code> saca los espacios del principio y del final. <code>upper()<\/code> pasa todo a mayúsculas. <code>split(\" \")<\/code> corta el texto en cada espacio y devuelve una lista. Se aplican de izquierda a derecha, cada uno sobre el resultado del anterior.<\/p>"}]}, {"code": "texto = \"Algoritmos\"\nr = texto[1:6]\nr = r[::-1].upper()", "parts": [{"type": "valor", "pts": 2, "q": "Escriba el valor final de <code>r<\/code>.", "expr": "r"}, {"type": "explica", "pts": 2, "q": "¿Qué parte de la cadena selecciona <code>texto[1:6]<\/code> y por qué el carácter de la posición 6 no forma parte?", "model": "<p>Selecciona desde la posición 1 hasta la 5: <code>\"lgori\"<\/code>. En las rebanadas el <strong>inicio se incluye y el fin no<\/strong>, por eso la posición 6 (<code>t<\/code>) queda afuera. La cantidad de caracteres es fin − inicio = 5.<\/p>"}, {"type": "explica", "pts": 2, "q": "¿Qué ocurriría si se ejecutara <code>texto[3] = \"x\"<\/code>? Justifique.", "model": "<p>Lanza <strong><code>TypeError<\/code><\/strong>: las cadenas son <strong>inmutables<\/strong> y no admiten asignación por índice. Para \"cambiarla\" hay que crear otra, por ejemplo <code>texto[:3] + \"x\" + texto[4:]<\/code>.<\/p>"}]}, {"code": "numeros = [3, 6, 9, 12]\nresultado = list(map(lambda x: x // 2 if x % 2 == 0 else x * 2, numeros))", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué valor toma <code>resultado<\/code>?", "expr": "resultado"}, {"type": "explica", "pts": 2, "q": "Explique cómo funciona <code>map<\/code> en este caso, incluyendo el rol del condicional dentro de la lambda.", "model": "<p><code>map<\/code> aplica la lambda a <strong>cada<\/strong> elemento de la lista, en orden, y <code>list<\/code> junta los resultados. La lambda usa un condicional en una línea: si el número es par devuelve su mitad (<code>x // 2<\/code>); si es impar, su doble.<\/p>"}]}, {"code": "datos = {4, 8, 15}\ndatos.add(8)\ndatos.add(16)\ndatos.discard(4)", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué elementos contiene finalmente <code>datos<\/code>?", "expr": "datos", "explain": "<p><code>add(8)<\/code> no hace nada porque el 8 ya estaba: un conjunto no admite duplicados. El orden en que se escriben no importa.<\/p>"}, {"type": "explica", "pts": 2, "q": "¿Sería posible acceder a un elemento con <code>datos[0]<\/code>? Justifique.", "model": "<p>No: lanza <strong><code>TypeError<\/code><\/strong> (<code>'set' object is not subscriptable<\/code>). Los conjuntos <strong>no tienen orden ni índices<\/strong>; sólo se puede preguntar si un elemento pertenece (<code>in<\/code>) o recorrerlos con <code>for<\/code>.<\/p>"}]}, {"code": "claves = [\"legajo\", \"nombre\", \"nota\"]\nregistros = [[101, \"Ana\", 8], [102, \"Luis\", 6]]\nresultado = dict(zip(claves, registros[1]))", "parts": [{"type": "valor", "pts": 2, "q": "Escriba el valor de <code>resultado<\/code>.", "expr": "resultado"}, {"type": "explica", "pts": 2, "q": "Explique qué hace <code>zip<\/code> en este contexto.", "model": "<p><code>zip<\/code> arma pares tomando un elemento de cada lista en la misma posición: <code>('legajo', 102)<\/code>, <code>('nombre', 'Luis')<\/code>, <code>('nota', 6)<\/code>. <code>dict<\/code> convierte esos pares en clave: valor.<\/p>"}, {"type": "explica", "pts": 2, "q": "¿Qué pasaría si <code>claves<\/code> tuviera 4 elementos?", "model": "<p><code>zip<\/code> corta en el iterable <strong>más corto<\/strong>: se formarían sólo 3 pares y la cuarta clave no aparecería en el diccionario. Para que todas las claves tengan valor, las dos listas tienen que tener la misma cantidad de elementos.<\/p>"}]}, {"code": "import re\ntexto = \"Pedido 4512 enviado el 03/11 a las 14hs\"", "parts": [{"type": "valor", "pts": 3, "q": "¿Qué devuelve <code>re.findall(r\"\\d+\", texto)<\/code>?", "expr": "re.findall(r\"\\d+\", texto)", "explain": "<p><code>\\d+<\/code> busca secuencias de uno o más dígitos. <code>findall<\/code> devuelve una lista de <strong>cadenas<\/strong>, no de números.<\/p>"}, {"type": "valor", "pts": 3, "q": "¿Qué devuelve <code>re.findall(r\"\\d{2}/\\d{2}\", texto)<\/code>?", "expr": "re.findall(r\"\\d{2}/\\d{2}\", texto)"}]}, {"code": "def convertir(v):\n    try:\n        n = int(v)\n    except ValueError:\n        print(\"No es entero\")\n    else:\n        print(\"Doble:\", n * 2)\n    finally:\n        print(\"Listo\")", "parts": [{"type": "salida", "pts": 2, "q": "¿Qué imprime <code>convertir(\"21\")<\/code>?", "code": "def convertir(v):\n    try:\n        n = int(v)\n    except ValueError:\n        print(\"No es entero\")\n    else:\n        print(\"Doble:\", n * 2)\n    finally:\n        print(\"Listo\")\n\nconvertir(\"21\")"}, {"type": "salida", "pts": 2, "q": "¿Qué imprime <code>convertir(\"2.1\")<\/code>?", "code": "def convertir(v):\n    try:\n        n = int(v)\n    except ValueError:\n        print(\"No es entero\")\n    else:\n        print(\"Doble:\", n * 2)\n    finally:\n        print(\"Listo\")\n\nconvertir(\"2.1\")", "explain": "<p><code>int(\"2.1\")<\/code> lanza <code>ValueError<\/code> (un texto con punto no es un entero). El <code>else<\/code> sólo corre si no hubo error y el <code>finally<\/code> corre siempre.<\/p>"}]}, {"code": "f = open(\"log.txt\", \"w\")\nf.write(\"inicio\\n\")\nf.close()\nf = open(\"log.txt\", \"a\")\nf.write(\"proceso\\n\")\nf.write(\"fin\")\nf.close()\nwith open(\"log.txt\") as f:\n    lineas = f.readlines()\nprint(len(lineas))\nprint(lineas[-1])", "parts": [{"type": "salida", "pts": 2, "q": "¿Qué imprime el programa?"}, {"type": "explica", "pts": 2, "q": "¿Qué contendría <code>log.txt<\/code> si en el segundo <code>open<\/code> se usara <code>\"w\"<\/code> en lugar de <code>\"a\"<\/code>?", "model": "<p>El modo <code>\"w\"<\/code> <strong>vacía<\/strong> el archivo al abrirlo, así que se perdería <code>inicio<\/code> y quedarían sólo dos líneas: <code>proceso<\/code> y <code>fin<\/code>.<\/p>"}]}, {"files": {"ventas.txt": "lunes,1500\nmartes,2300\nmiercoles,800\n"}, "code": "# ventas.txt contiene: lunes,1500 / martes,2300 / miercoles,800\nmejor = \"\"\nmaximo = 0\nwith open(\"ventas.txt\", \"r\") as archivo:\n    for linea in archivo:\n        dia, monto = linea.strip().split(\",\")\n        if int(monto) > maximo:\n            maximo = int(monto)\n            mejor = dia\nprint(mejor, maximo)", "parts": [{"type": "salida", "pts": 3, "q": "¿Qué imprime el programa?"}, {"type": "explica", "pts": 3, "q": "¿Qué ocurriría si el archivo <code>ventas.txt<\/code> no existiera? ¿Cómo se podría evitar que el programa se corte?", "model": "<p><code>open<\/code> en modo <code>\"r\"<\/code> lanza <strong><code>FileNotFoundError<\/code><\/strong> y el programa se corta con un traceback. Se evita poniendo el <code>with open(...)<\/code> dentro de un <code>try<\/code> con <code>except FileNotFoundError:<\/code> que muestre un mensaje.<\/p>"}]}, {"code": "import re\ntexto = \"contacto: ventas@tienda.com.ar o 11-4567-8910\"", "parts": [{"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>re.findall(r\"[\\w.]+@[\\w.]+\", texto)<\/code>?", "expr": "re.findall(r\"[\\w.]+@[\\w.]+\", texto)"}, {"type": "valor", "pts": 2, "q": "¿Qué devuelve <code>re.search(r\"\\d{4}-\\d{4}\", texto).group()<\/code>?", "expr": "re.search(r\"\\d{4}-\\d{4}\", texto).group()"}]}, {"code": "valores = [\"5\", \"0\", \"abc\", \"20\"]\nfor v in valores:\n    try:\n        print(100 // int(v))\n    except ValueError:\n        print(\"Dato inválido\")\n    except ZeroDivisionError:\n        print(\"No se puede dividir por cero\")", "parts": [{"type": "salida", "pts": 3, "q": "¿Qué imprime el programa?"}, {"type": "salida", "pts": 3, "q": "¿Qué imprimiría si la lista fuera <code>[\"4\", \"x\", \"-3\"]<\/code>?", "code": "valores = [\"4\", \"x\", \"-3\"]\nfor v in valores:\n    try:\n        print(100 // int(v))\n    except ValueError:\n        print(\"Dato inválido\")\n    except ZeroDivisionError:\n        print(\"No se puede dividir por cero\")", "explain": "<p><code>100 // -3<\/code> redondea <strong>hacia abajo<\/strong>: −33.33 → −34.<\/p>"}]}], "consoleStarter": "# Consola libre: escribí cualquier programa y ejecutalo con Ctrl+Enter.\n# Hay archivos de ejemplo para practicar open(): notas.txt,\n# latencias.txt, productos.json, paises.json, stock.json, roto.json\n\nwith open(\"notas.txt\", encoding=\"utf-8\") as f:\n    for linea in f:\n        nombre, nota = linea.strip().split(\",\")\n        print(f\"{nombre:<6} {int(nota):>3}\")"};
const RUNNER = "import sys, io, os, json, time, traceback, builtins, shutil, linecache, re as _re_mod\n\nBASE = os.environ.get(\"REPASO_BASE\", \"/home/pyodide\")\nWORK = os.path.join(BASE, \"ejercicio\")\nCONS = os.path.join(BASE, \"consola\")\nos.makedirs(WORK, exist_ok=True)\nos.makedirs(CONS, exist_ok=True)\nLIMIT = 4.0\n\n\nclass SinEntrada(BaseException):\n    pass\n\n\nclass Demora(BaseException):\n    pass\n\n\ndef _prep_dir(d, files, reset):\n    if reset:\n        for f in os.listdir(d):\n            p = os.path.join(d, f)\n            if os.path.isdir(p):\n                shutil.rmtree(p)\n            else:\n                os.remove(p)\n    for name, content in (files or {}).items():\n        with open(os.path.join(d, name), \"w\", encoding=\"utf-8\") as fh:\n            fh.write(content)\n\n\ndef _lines(stdin_text):\n    if not stdin_text:\n        return []\n    ls = stdin_text.replace(\"\\r\", \"\").split(\"\\n\")\n    if ls and ls[-1] == \"\":\n        ls.pop()\n    return ls\n\n\ndef _make_input(lines):\n    it = iter(lines)\n\n    def _input(prompt=\"\"):\n        prompt = str(prompt)\n        sys.stdout.write(prompt)\n        try:\n            v = next(it)\n        except StopIteration:\n            sys.stdout.write(\"\\n\")\n            raise SinEntrada()\n        sys.stdout.write(v + \"\\n\")\n        return v\n\n    return _input\n\n\ndef _guard(fn, out, limit=LIMIT):\n    start = time.time()\n    cnt = [0]\n\n    def local(frame, event, arg):\n        cnt[0] += 1\n        if cnt[0] % 1000 == 0 and time.time() - start > limit:\n            raise Demora()\n        return local\n\n    def glob(frame, event, arg):\n        if frame.f_code.co_filename == \"<programa>\":\n            return local\n        return None\n\n    old = (sys.stdout, sys.stderr)\n    sys.stdout = out\n    sys.stderr = out\n    sys.settrace(glob)\n    try:\n        return fn()\n    finally:\n        sys.settrace(None)\n        sys.stdout, sys.stderr = old\n\n\ndef _fmt_exc(e):\n    tb = traceback.extract_tb(e.__traceback__)\n    frames = [f for f in tb if f.filename == \"<programa>\"]\n    parts = [\"Traceback (most recent call last):\"]\n    for f in frames:\n        where = \"<module>\" if f.name == \"<module>\" else f.name\n        parts.append(f\"  L\u00ednea {f.lineno}, en {where}\")\n        if f.line:\n            parts.append(\"    \" + f.line.strip())\n    msg = str(e)\n    parts.append(f\"{type(e).__name__}: {msg}\" if msg else type(e).__name__)\n    return {\n        \"type\": type(e).__name__,\n        \"msg\": msg,\n        \"line\": frames[-1].lineno if frames else None,\n        \"trace\": \"\\n\".join(parts),\n    }\n\n\ndef _fmt_syntax(e):\n    txt = (e.text or \"\").rstrip(\"\\n\")\n    parts = [f\"  L\u00ednea {e.lineno}\"]\n    if txt:\n        parts.append(\"    \" + txt.strip())\n    parts.append(f\"{type(e).__name__}: {e.msg}\")\n    return {\"type\": type(e).__name__, \"msg\": e.msg, \"line\": e.lineno, \"trace\": \"\\n\".join(parts)}\n\n\ndef _register(code):\n    linecache.cache[\"<programa>\"] = (len(code), None, code.splitlines(True), \"<programa>\")\n\n\ndef _exec(code, stdin_text, d, ns=None, limit=LIMIT):\n    os.chdir(d)\n    out = io.StringIO()\n    if ns is None:\n        ns = {\"__name__\": \"__main__\", \"__builtins__\": builtins}\n    ns[\"input\"] = _make_input(_lines(stdin_text))\n    _register(code)\n    try:\n        compiled = compile(code, \"<programa>\", \"exec\")\n    except SyntaxError as e:\n        return out.getvalue(), _fmt_syntax(e), ns, False\n    err = None\n    sin = False\n    try:\n        _guard(lambda: exec(compiled, ns), out, limit)\n    except SinEntrada:\n        sin = True\n    except Demora:\n        err = {\"type\": \"Demora\", \"msg\": \"\", \"line\": None,\n               \"trace\": \"El programa tard\u00f3 demasiado y se cort\u00f3. \u00bfHay un ciclo que nunca termina?\"}\n    except SystemExit:\n        pass\n    except BaseException as e:\n        err = _fmt_exc(e)\n    return out.getvalue(), err, ns, sin\n\n\ndef _eq(a, b):\n    if isinstance(a, bool) != isinstance(b, bool):\n        return False\n    if isinstance(a, float) or isinstance(b, float):\n        try:\n            return abs(a - b) < 1e-6\n        except Exception:\n            return False\n    if type(a) in (list, tuple) and type(a) == type(b):\n        return len(a) == len(b) and all(_eq(x, y) for x, y in zip(a, b))\n    if isinstance(a, dict) and isinstance(b, dict):\n        return a.keys() == b.keys() and all(_eq(a[k], b[k]) for k in a)\n    try:\n        return a == b\n    except Exception:\n        return False\n\n\ndef _short(v, n=300):\n    r = repr(v)\n    return r if len(r) <= n else r[:n] + \"\u2026\"\n\n\ndef _norm(s):\n    return \" \".join(s.split()).lower()\n\n\ndef run_program(payload):\n    p = json.loads(payload)\n    d = CONS if p.get(\"where\") == \"consola\" else WORK\n    if d == WORK:\n        _prep_dir(WORK, p.get(\"files\"), True)\n    out, err, ns, sin = _exec(p[\"code\"], p.get(\"stdin\", \"\"), d)\n    if d == CONS:\n        globals()[\"_cons_ns\"] = ns\n    return json.dumps({\"out\": out, \"error\": err, \"sin_entrada\": sin})\n\n\ndef console_eval(src):\n    ns = globals().get(\"_cons_ns\")\n    if ns is None:\n        ns = {\"__name__\": \"__main__\", \"__builtins__\": builtins}\n        ns[\"input\"] = _make_input([])\n        globals()[\"_cons_ns\"] = ns\n    os.chdir(CONS)\n    out = io.StringIO()\n    _register(src)\n    err = None\n    try:\n        try:\n            c = compile(src, \"<programa>\", \"eval\")\n            val = _guard(lambda: eval(c, ns), out)\n            if val is not None:\n                out.write(repr(val) + \"\\n\")\n        except SyntaxError:\n            c = compile(src, \"<programa>\", \"exec\")\n            _guard(lambda: exec(c, ns), out)\n    except SyntaxError as e:\n        err = _fmt_syntax(e)\n    except SinEntrada:\n        out.write(\"(input() no tiene datos ac\u00e1: us\u00e1 el cuadro de Datos de entrada y Ejecutar)\\n\")\n    except Demora:\n        err = {\"type\": \"Demora\", \"msg\": \"\", \"line\": None, \"trace\": \"Se cort\u00f3 por tardar demasiado.\"}\n    except BaseException as e:\n        err = _fmt_exc(e)\n    return json.dumps({\"out\": out.getvalue(), \"error\": err})\n\n\ndef list_files():\n    res = []\n    for f in sorted(os.listdir(CONS)):\n        p = os.path.join(CONS, f)\n        if os.path.isfile(p):\n            try:\n                with open(p, encoding=\"utf-8\") as fh:\n                    txt = fh.read(20000)\n            except Exception:\n                txt = \"(no se puede mostrar)\"\n            res.append({\"name\": f, \"content\": txt})\n    return json.dumps(res)\n\n\ndef reset_console(files_json):\n    _prep_dir(CONS, json.loads(files_json), True)\n    globals()[\"_cons_ns\"] = None\n    return \"ok\"\n\n\ndef _src_checks(code, checks):\n    res = []\n    for c in checks or []:\n        if \"forbid\" in c:\n            ok = _re_mod.search(c[\"forbid\"], code) is None\n        else:\n            ok = _re_mod.search(c[\"require\"], code) is not None\n        res.append({\"label\": c[\"msg\"], \"ok\": ok, \"kind\": \"src\"})\n    return res\n\n\ndef verify(payload):\n    p = json.loads(payload)\n    code = p[\"code\"]\n    files = p.get(\"files\")\n    results = []\n    if \"___\" in code:\n        return json.dumps({\"fatal\": True, \"out\": \"\", \"error\": None,\n                           \"results\": [{\"label\": \"Todav\u00eda hay huecos ___ sin completar\", \"ok\": False}]})\n    first_out = \"\"\n    if p.get(\"tests\"):\n        _prep_dir(WORK, files, True)\n        out, err, ns, sin = _exec(code, p.get(\"stdin\", \"\"), WORK)\n        first_out = out\n        if err:\n            return json.dumps({\"fatal\": True, \"out\": out, \"error\": err, \"results\": []})\n        for t in p[\"tests\"]:\n            label = t.get(\"label\") or t[\"call\"]\n            if t.get(\"fresh\"):\n                _prep_dir(WORK, files, True)\n            os.chdir(WORK)\n            buf = io.StringIO()\n            try:\n                exp = eval(t.get(\"expect\", \"None\"), {})\n            except Exception as e:\n                results.append({\"label\": label, \"ok\": False, \"err\": \"error interno del test: \" + repr(e)})\n                continue\n            try:\n                if t.get(\"stdin\") is not None:\n                    ns[\"input\"] = _make_input(_lines(t[\"stdin\"]))\n                if t.get(\"pre\"):\n                    pc = compile(t[\"pre\"], \"<test>\", \"exec\")\n                    _guard(lambda: exec(pc, ns), buf)\n                c = compile(t[\"call\"], \"<test>\", \"eval\")\n                got = _guard(lambda: eval(c, ns), buf)\n                if t.get(\"raises\"):\n                    results.append({\"label\": label, \"ok\": False, \"exp\": \"que lance \" + t[\"raises\"],\n                                    \"got\": _short(got)})\n                    continue\n                ok = _eq(got, exp)\n                results.append({\"label\": label, \"ok\": ok, \"exp\": _short(exp), \"got\": _short(got)})\n            except Demora:\n                results.append({\"label\": label, \"ok\": False, \"err\": \"tard\u00f3 demasiado (\u00bfciclo infinito?)\"})\n            except SinEntrada:\n                results.append({\"label\": label, \"ok\": False, \"err\": \"la funci\u00f3n pidi\u00f3 un input() que no correspond\u00eda\"})\n            except BaseException as e:\n                if t.get(\"raises\") and type(e).__name__ == t[\"raises\"]:\n                    results.append({\"label\": label, \"ok\": True, \"exp\": \"lanza \" + t[\"raises\"],\n                                    \"got\": \"lanz\u00f3 \" + type(e).__name__})\n                else:\n                    results.append({\"label\": label, \"ok\": False, \"exp\": \"lanza \" + t[\"raises\"] if t.get(\"raises\") else _short(exp),\n                                    \"err\": f\"{type(e).__name__}: {e}\"})\n    for t in p.get(\"io\") or []:\n        _prep_dir(WORK, files, True)\n        out, err, ns, sin = _exec(code, t.get(\"stdin\", \"\"), WORK)\n        if not first_out:\n            first_out = out\n        label = t.get(\"label\") or (\"Con entrada: \" + \" | \".join(_lines(t.get(\"stdin\", \"\"))))\n        if err:\n            results.append({\"label\": label, \"ok\": False, \"err\": err[\"trace\"].splitlines()[-1], \"out\": out})\n            continue\n        if sin:\n            results.append({\"label\": label, \"ok\": False, \"err\": \"el programa pidi\u00f3 m\u00e1s datos de los previstos\", \"out\": out})\n            continue\n        n = _norm(out)\n        missing = [c for c in t.get(\"contains\", []) if _norm(c) not in n]\n        extra = [c for c in t.get(\"absent\", []) if _norm(c) in n]\n        ok = not missing and not extra\n        detail = \"\"\n        if missing:\n            detail = \"falta en la salida: \" + \", \".join(repr(m) for m in missing)\n        if extra:\n            detail += (\"; \" if detail else \"\") + \"no deber\u00eda aparecer: \" + \", \".join(repr(m) for m in extra)\n        for chk in t.get(\"checks\", []):\n            try:\n                got = _guard(lambda: eval(compile(chk[\"call\"], \"<test>\", \"eval\"), ns), io.StringIO())\n                exp = eval(chk[\"expect\"], {})\n                if not _eq(got, exp):\n                    ok = False\n                    detail += (\"; \" if detail else \"\") + f\"{chk.get('label', chk['call'])}: esperado {_short(exp)}, obtuve {_short(got)}\"\n            except BaseException as e:\n                ok = False\n                detail += (\"; \" if detail else \"\") + f\"{chk.get('label', chk['call'])}: {type(e).__name__}: {e}\"\n        results.append({\"label\": label, \"ok\": ok, \"err\": detail or None, \"out\": out})\n    results += _src_checks(code, p.get(\"src\"))\n    return json.dumps({\"fatal\": False, \"out\": first_out, \"error\": None, \"results\": results})\n\n\ndef _cmp_output(pred, real, err):\n    def lines(s):\n        return [\" \".join(l.split()) for l in s.strip().splitlines() if l.strip() != \"\"]\n    pl = lines(pred)\n    rl = lines(real)\n    if err:\n        name = err[\"type\"]\n        if not pl:\n            return False\n        joined = \" \".join(pl[len(rl):]) if len(pl) > len(rl) else \"\"\n        return pl[:len(rl)] == rl and name.lower() in joined.lower()\n    return pl == rl\n\n\ndef predict(payload):\n    p = json.loads(payload)\n    _prep_dir(WORK, p.get(\"files\"), True)\n    out, err, ns, sin = _exec(p[\"code\"], p.get(\"stdin\", \"\"), WORK)\n    ok = _cmp_output(p.get(\"pred\", \"\"), out, err) if p.get(\"pred\") is not None else None\n    return json.dumps({\"out\": out, \"error\": err, \"ok\": ok})\n\n\ndef eval_value(payload):\n    \"\"\"Simulacro: eval\u00faa expr luego de setup y compara con la respuesta del alumno.\"\"\"\n    p = json.loads(payload)\n    _prep_dir(WORK, p.get(\"files\"), True)\n    out, err, ns, sin = _exec(p.get(\"setup\", \"\"), \"\", WORK)\n    if err:\n        return json.dumps({\"error\": err})\n    ans = (p.get(\"ans\") or \"\").strip()\n    try:\n        val = _guard(lambda: eval(compile(p[\"expr\"], \"<programa>\", \"eval\"), ns), io.StringIO())\n        shown = repr(val)\n        ok = False\n        if ans:\n            try:\n                ok = _eq(eval(ans, {}), val)\n            except Exception:\n                ok = False\n            if not ok:\n                ok = _norm(ans) in (_norm(str(val)), _norm(repr(val)))\n    except BaseException as e:\n        name = type(e).__name__\n        shown = f\"{name}: {e}\"\n        ok = bool(ans) and name.lower() in ans.lower()\n    return json.dumps({\"value\": shown, \"ok\": ok})\n";
