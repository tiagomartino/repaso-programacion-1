/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("p1rep:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("p1rep:" + k, JSON.stringify(v)); } catch { } },
  del(k) { try { localStorage.removeItem("p1rep:" + k); } catch { } }
};
function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  if (html != null) e.innerHTML = html;
  return e;
}

/* ---------- resaltado de sintaxis ---------- */
const KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input len range int float str bool list dict set tuple sum max min sorted reversed enumerate zip map filter abs round open type isinstance any all chr ord repr format next iter".split(" "));
function hl(code) {
  const re = /(#[^\n]*)|([rRfFbB]{0,2}"""[\s\S]*?"""|[rRfFbB]{0,2}'''[\s\S]*?'''|[rRfFbB]{0,2}"(?:\\.|[^"\\\n])*"?|[rRfFbB]{0,2}'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|(\b[A-Za-z_]\w*\b)|(___)/g;
  let out = "", last = 0, m, prevDef = false;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="hl-com">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="hl-str">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="hl-num">${esc(t)}</span>`;
    else if (m[5]) out += `<span class="hl-gap">${esc(t)}</span>`;
    else if (m[4]) {
      if (prevDef) out += `<span class="hl-def">${t}</span>`;
      else if (KW.has(t)) out += `<span class="hl-kw">${t}</span>`;
      else if (BI.has(t)) out += `<span class="hl-bi">${t}</span>`;
      else out += t;
      prevDef = (t === "def" || t === "class");
      last = re.lastIndex; continue;
    }
    prevDef = false;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---------- editor ---------- */
function makeEditor(host, code, { onRun, onChange } = {}) {
  host.innerHTML = `<div class="ed"><div class="ed-wrap"><div class="ed-grid"><div class="ed-gutter"></div><div class="ed-area"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código Python"></textarea></div></div></div></div>`;
  const ta = $("textarea", host), pre = $("pre", host), gut = $(".ed-gutter", host);
  function paint() {
    const v = ta.value;
    pre.innerHTML = hl(v) + "\n";
    const n = v.split("\n").length;
    let g = ""; for (let i = 1; i <= n; i++) g += i + "\n";
    gut.textContent = g;
  }
  ta.value = code; paint();
  ta.addEventListener("input", () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onRun && onRun(); return; }
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if (e.key === "Tab") {
      e.preventDefault();
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      if (s !== en && v.slice(s, en).includes("\n")) {
        const block = v.slice(ls, en);
        const nb = e.shiftKey ? block.replace(/^ {1,4}/gm, "") : block.replace(/^/gm, "    ");
        ta.setRangeText(nb, ls, en, "select");
      } else if (e.shiftKey) {
        const lead = v.slice(ls).match(/^ {1,4}/);
        if (lead) { ta.setRangeText("", ls, ls + lead[0].length, "end"); }
      } else ta.setRangeText("    ", s, en, "end");
      paint(); onChange && onChange(ta.value);
    } else if (e.key === "Enter" && !e.shiftKey) {
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(ls, s);
      let ind = line.match(/^ */)[0];
      if (/:\s*(#.*)?$/.test(line)) ind += "    ";
      e.preventDefault();
      ta.setRangeText("\n" + ind, s, en, "end");
      paint(); onChange && onChange(ta.value);
    } else if (e.key === "Backspace" && s === en) {
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before) && before.length % 4 === 0) {
        e.preventDefault(); ta.setRangeText("", s - 4, s, "end"); paint(); onChange && onChange(ta.value);
      }
    }
  });
  return { get: () => ta.value, set: v => { ta.value = v; paint(); }, focus: () => ta.focus(), ta };
}

/* ---------- Python (Pyodide) ---------- */
let py = null, pyReady = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("no cargó " + src)); document.head.appendChild(s); });
}
async function bootPython() {
  const chip = $("#pyChip");
  const local = new URL("pyodide/", location.href).href;
  const cdn = `https://cdn.jsdelivr.net/npm/pyodide@${PYODIDE_VER}/`;
  let bases = [cdn];
  if (location.protocol !== "file:") {
    try { const r = await fetch(local + "pyodide-lock.json", { method: "HEAD" }); if (r.ok) bases = [local, cdn]; } catch { }
  }
  let lastErr;
  for (const base of bases) {
    try {
      if (typeof loadPyodide !== "function") await loadScript(base + "pyodide.js");
      const opts = { indexURL: base, stdout: () => { }, stderr: () => { } };
      if (base === local) opts.stdLibURL = base + "python_stdlib.wasm";
      py = await loadPyodide(opts);
      break;
    } catch (e) { lastErr = e; py = null; }
  }
  if (!py) {
    chip.className = "chip fail"; chip.lastElementChild.textContent = "Python no pudo cargar";
    chip.title = String(lastErr || "") + " — revisá tu conexión a internet y recargá la página.";
    throw lastErr || new Error("sin Python");
  }
  py.runPython(RUNNER);
  py.globals.get("reset_console")(JSON.stringify(CONSOLE_FILES));
  chip.className = "chip ready"; chip.lastElementChild.textContent = "Python 3.12 listo";
  return py;
}
function ensurePy() { if (!pyReady) pyReady = bootPython(); return pyReady; }
async function pycall(fn, payload) {
  await ensurePy();
  const f = py.globals.get(fn);
  const r = typeof payload === "string" ? f(payload) : f(JSON.stringify(payload));
  f.destroy && f.destroy();
  return JSON.parse(r);
}

/* ---------- ayuda de errores ---------- */
const ERR_HELP = {
  SyntaxError: "Error de sintaxis: Python no entiende cómo está escrita esa línea. Revisá los dos puntos (:) al final de if/for/while/def, los paréntesis y las comillas.",
  IndentationError: "Error de sangría: los bloques dentro de if/for/while/def tienen que tener la misma sangría (4 espacios).",
  NameError: "Usaste un nombre (variable o función) que no existe en ese momento. ¿Está bien escrito? ¿Lo definiste antes de usarlo?",
  TypeError: "Operación con tipos incompatibles. Por ejemplo, sumar str + int, o llamar a una función con una cantidad incorrecta de argumentos.",
  ValueError: "El tipo es correcto pero el valor no sirve. Típico: int(\"hola\"), o lista.remove(x) con un x que no está.",
  IndexError: "Te fuiste de rango: el índice no existe en la lista o cadena. Recordá que van de 0 a len - 1.",
  KeyError: "La clave no existe en el diccionario. Usá get() o preguntá con 'in' antes de acceder.",
  ZeroDivisionError: "División por cero.",
  AttributeError: "Ese tipo de dato no tiene ese método. Por ejemplo, las tuplas no tienen append y los str no tienen sort.",
  FileNotFoundError: "No existe un archivo con ese nombre en la carpeta actual.",
  UnboundLocalError: "Usás una variable local antes de asignarle un valor dentro de la función.",
  RecursionError: "Demasiadas llamadas anidadas.",
  Demora: "Revisá que la condición del while cambie en algún momento.",
};
function errHelpHTML(err) {
  if (!err) return "";
  const h = ERR_HELP[err.type];
  return h ? `<div class="errhelp"><b>${esc(err.type)}</b> · ${esc(h)}${err.line ? ` Mirá la línea ${err.line}.` : ""}</div>` : "";
}
function outHTML(r) {
  let s = esc(r.out || "");
  if (r.sin_entrada) s += `<span class="note">⏸ El programa pidió un input() más y no quedan datos de entrada. Cargalos en "Datos de entrada", uno por línea.</span>\n`;
  if (r.error) s += `<span class="err">${esc(r.error.trace)}</span>`;
  if (!s.trim()) s = `<span class="note">(el programa no imprimió nada)</span>`;
  return s;
}

function wireSnippets(root) {
  root.querySelectorAll("pre.py").forEach(pre => {
    const code = pre.textContent.replace(/\n$/, "");
    const stdin = pre.dataset.stdin || "";
    const box = el("div", { class: "snip" });
    const p = el("pre", {}, hl(code));
    const bar = el("div", { class: "snip-bar" });
    const out = el("pre", { class: "out" }); out.hidden = true;
    const run = el("button", { class: "sbtn primary" }, "▶ Ejecutar");
    const toC = el("button", { class: "sbtn" }, "Abrir en consola");
    bar.append(run, toC);
    if (stdin) bar.append(el("span", { class: "sbtn", style: "border-style:dashed;cursor:default" }, "entrada: " + esc(stdin.split("\n").join(" | "))));
    box.append(p, bar, out);
    pre.replaceWith(box);
    run.addEventListener("click", async () => {
      run.disabled = true; out.hidden = false; out.innerHTML = `<span class="note">Ejecutando…</span>`;
      try { const r = await pycall("run_program", { code, stdin, where: "consola" }); out.innerHTML = outHTML(r) + (r.error ? "" : ""); }
      catch (e) { out.innerHTML = `<span class="err">No se pudo ejecutar: ${esc(e.message || e)}</span>`; }
      run.disabled = false;
    });
    toC.addEventListener("click", () => openConsole(code, stdin));
  });
  root.querySelectorAll("pre.txt").forEach(pre => { pre.classList.add("codeview"); const w = el("div", { class: "snip" }); pre.replaceWith(w); w.append(pre); });
  root.querySelectorAll("table").forEach(t => { if (!t.parentElement.classList.contains("tbl")) { const w = el("div", { class: "tbl" }); t.replaceWith(w); w.append(t); } });

  if (r.fatal && r.error) return `<div class="banner bad">El programa da error antes de poder probarlo</div><pre class="out" style="border-radius:8px;margin-top:8px">${outHTML(r)}</pre>${errHelpHTML(r.error)}`;
  const ok = r.results.length && r.results.every(x => x.ok);
  h += `<div class="banner ${ok ? "ok" : "bad"}">${ok ? "✔ ¡Bien! Pasó todas las pruebas." : `✘ Pasó ${r.results.filter(x => x.ok).length} de ${r.results.length} pruebas`}</div><div class="results">`;
  for (const x of r.results) {
    let det = "";
    if (!x.ok) {
      if (x.err) det += `<small>${esc(x.err)}</small>`;
      if (x.exp !== undefined && x.got !== undefined) det += `<small>esperado: ${esc(x.exp)}\nobtenido: ${esc(x.got)}</small>`;
      else if (x.exp !== undefined && x.err) det += `<small>esperado: ${esc(x.exp)}</small>`;
      if (x.out) det += `<small>salida:\n${esc(x.out.slice(0, 600))}</small>`;
    }
    h += `<div class="res ${x.ok ? "ok" : "bad"}"><span class="ico">${x.ok ? "✔" : "✘"}</span><div><b>${esc(x.label)}</b>${det}</div></div>`;
  }
  return h + "</div>";
}
function renderExercise(x, num) {
  const card = el("article", { class: "ex" + (progress[x.id] ? " done" : ""), id: "ex-" + x.id });
  const lvl = [1, 2, 3].map(i => `<i class="${i <= x.level ? "f" : ""}"></i>`).join("");
  card.innerHTML = `<div class="ex-head"><span class="kind k-${x.kind}">${KIND_LABEL[x.kind]}</span><h3 class="ex-title">${num}. ${esc(x.title)}</h3><span class="lvl" title="Dificultad ${x.level} de 3">${lvl}</span><span class="status">${progress[x.id] ? "✔ Resuelto" : ""}</span></div><div class="ex-body"><div class="prompt">${x.prompt}</div></div>`;
  const body = $(".ex-body", card);
  wireSnippets($(".prompt", body));
  const setDone = () => { markDone(x.id); card.classList.add("done"); $(".status", card).textContent = "✔ Resuelto"; };
  if (x.kind === "predecir") {
    body.insertAdjacentHTML("beforeend", `<div class="snip"><pre>${hl(x.code)}</pre></div>${x.stdin ? `<p style="margin:6px 0;font-size:.9rem">Datos de entrada: <code>${esc(x.stdin.split("\n").join(" | "))}</code></p>` : ""}${filesHTML(x.files)}
    <div class="pred"><label for="pred-${x.id}">¿Qué imprime? Escribí la salida exacta, una línea por cada print. Si da error, escribí el nombre del error.</label><textarea id="pred-${x.id}" spellcheck="false"></textarea></div>
    <div class="btnrow"><button class="btn primary" data-a="check">Comprobar</button><button class="btn" data-a="show">Ver la respuesta</button></div><div class="fb"></div>`);
    const ta = $("textarea", body), fb = $(".fb", body);
    ta.value = store.get("code:" + x.id, "");
    ta.addEventListener("input", () => store.set("code:" + x.id, ta.value));
    const go = async (reveal) => {
      const btns = body.querySelectorAll(".btnrow .btn"); btns.forEach(b => b.disabled = true);
      fb.innerHTML = `<div class="hint">Ejecutando…</div>`;
      try {
        const r = await pycall("predict", { code: x.code, stdin: x.stdin || "", files: x.files || {}, pred: reveal ? null : ta.value });
        let h = "";
        if (!reveal) h += `<div class="banner ${r.ok ? "ok" : "bad"}">${r.ok ? "✔ ¡Exacto!" : "✘ No coincide. Compará línea por línea con la salida real."}</div>`;
        h += `<pre class="out" style="border-radius:8px;margin-top:10px">${outHTML(r)}</pre>`;
        if (x.explain) h += `<div class="explain">${x.explain}</div>`;
        fb.innerHTML = h;
        if (r.ok) setDone();
      } catch (e) { fb.innerHTML = `<div class="banner bad">Python todavía no está disponible: ${esc(e.message || e)}</div>`; }
      btns.forEach(b => b.disabled = false);
    };
    $("[data-a=check]", body).addEventListener("click", () => { if (!ta.value.trim()) { ta.focus(); fb.innerHTML = `<div class="hint">Primero escribí tu predicción.</div>`; return; } go(false); });
    $("[data-a=show]", body).addEventListener("click", () => go(true));
    return card;
  }
  // escribir / completar / corregir
  const edHost = el("div"); body.append(edHost);
  if (x.files) body.insertAdjacentHTML("afterbegin", "");
  const saved = store.get("code:" + x.id, null);
  const runBtn = el("button", { class: "sbtn primary" }, "▶ Ejecutar");
  const verBtn = el("button", { class: "sbtn primary", style: "background:var(--ok);border-color:var(--ok);color:#fff" }, "✔ Verificar");
  const hintBtn = el("button", { class: "sbtn" }, "Pista");
  const solBtn = el("button", { class: "sbtn" }, "Ver solución");
  const resetBtn = el("button", { class: "sbtn" }, "Reiniciar código");
  const ed = makeEditor(edHost, saved ?? x.starter, { onRun: () => runBtn.click(), onChange: v => store.set("code:" + x.id, v) });
  const stdinWrap = el("div", { class: "stdin" }, `<label for="in-${x.id}">Datos de entrada para input() · uno por línea</label><textarea id="in-${x.id}" rows="2" spellcheck="false"></textarea>`);
  const stdinTa = $("textarea", stdinWrap); stdinTa.value = x.stdin || "";
  body.append(stdinWrap);
  const tb = el("div", { class: "toolbar" }); tb.append(runBtn, verBtn, el("span", { class: "sp" }));
  if (x.hint) tb.append(hintBtn);
  tb.append(solBtn, resetBtn);
  body.append(tb);
  const outBox = el("pre", { class: "out", style: "border-radius:0 0 10px 10px;margin-top:-1px;border:1px solid var(--code-line);border-top:0" }); outBox.hidden = true; body.append(outBox);
  const fb = el("div"); body.append(fb);
  const extra = el("div"); body.append(extra);
  if (x.files) { const f = el("details", { style: "margin-top:10px" }, `<summary style="cursor:pointer;font-size:.9rem">Archivos que existen al ejecutar (${Object.keys(x.files).length})</summary>${filesHTML(x.files)}`); body.insertBefore(f, edHost); }
  const busy = b => [runBtn, verBtn].forEach(z => z.disabled = b);
  runBtn.addEventListener("click", async () => {
    busy(true); outBox.hidden = false; outBox.innerHTML = `<span class="note">Ejecutando…</span>`;
    try { const r = await pycall("run_program", { code: ed.get(), stdin: stdinTa.value, files: x.files || {} }); outBox.innerHTML = outHTML(r); fb.innerHTML = errHelpHTML(r.error); }
    catch (e) { outBox.innerHTML = `<span class="err">Python no está disponible: ${esc(e.message || e)}</span>`; }
    busy(false);
  });
  verBtn.addEventListener("click", async () => {
    busy(true); fb.innerHTML = `<div class="hint">Verificando…</div>`;
    try {
      const r = await pycall("verify", { code: ed.get(), stdin: x.stdin || "", files: x.files || {}, tests: x.tests || [], io: x.io || [], src: x.src || [] });
      fb.innerHTML = resultsHTML(r);
      if (!r.fatal && r.results.length && r.results.every(z => z.ok)) setDone();
    } catch (e) { fb.innerHTML = `<div class="banner bad">Python no está disponible: ${esc(e.message || e)}</div>`; }
    busy(false);
  });
  hintBtn.addEventListener("click", () => { extra.innerHTML = `<div class="hint"><b>Pista.</b> ${x.hint}</div>`; });
  solBtn.addEventListener("click", () => {
    if (solBtn.dataset.c) {
      extra.innerHTML = `<div class="solution"><b>Una solución posible</b><pre class="py">${esc(x.solution)}</pre>${x.explain ? `<div style="margin-top:8px">${x.explain}</div>` : ""}<div class="btnrow"><button class="btn" data-a="copy">Pasar al editor</button></div></div>`;
      wireSnippets(extra);
      $("[data-a=copy]", extra).addEventListener("click", () => { ed.set(x.solution); store.set("code:" + x.id, x.solution); });
      solBtn.dataset.c = ""; solBtn.textContent = "Ver solución";
    } else { solBtn.dataset.c = "1"; solBtn.textContent = "¿Seguro? Tocá otra vez"; setTimeout(() => { if (solBtn.dataset.c) { solBtn.dataset.c = ""; solBtn.textContent = "Ver solución"; } }, 3500); }
  });
  resetBtn.addEventListener("click", () => { ed.set(x.starter); store.del("code:" + x.id); fb.innerHTML = ""; outBox.hidden = true; });
  return card;
}

/* ---------- simulacro ---------- */
const SCALE = [[0, 59, "Desaprobado"], [60, 64, "4"], [65, 69, "5"], [70, 74, "6"], [75, 79, "7"], [80, 87, "8"], [88, 94, "9"], [95, 100, "10"]];
function renderSim() {
  const S = DATA.simulacro;
  const page = $("#page");
  const scale = SCALE.map(([a, b, n]) => `<div data-a="${a}" data-b="${b}">${n}<span>${a}–${b}</span></div>`).join("");
  page.innerHTML = `<div class="eyebrow">Evaluación</div><h1>Simulacro de parcial</h1>
  <p class="lead">Mismo formato que el Simulacro 3: veinte preguntas "Dado el siguiente código…", 100 puntos, 120 minutos. Primero resolvelo como en el parcial, en papel o en tu cabeza, sin ejecutar nada.</p>
  <div class="scale" id="simScale">${scale}</div>
  <p style="max-width:68ch;font-size:.95rem">Las respuestas de valor o de salida se corrigen solas, porque se ejecuta el código de verdad. En las de <b>explicar</b>, escribí tu respuesta, mirá la respuesta modelo y marcá si la tuviste bien: así se suman esos puntos.</p>
  <div class="btnrow"><button class="btn" id="simTimer">Iniciar cronómetro de 120 min</button><span id="simClock" style="font-family:var(--f-mono);align-self:center"></span></div>
  <div id="simQs"></div>
  <div class="scorebox"><button class="btn primary" id="simGrade">Corregir simulacro</button><span class="big" id="simScore">— / 100</span><span id="simNote" style="color:var(--muted)">Respondé y tocá Corregir.</span><span style="flex:1"></span><button class="btn" id="simReset">Borrar respuestas</button></div>`;
  const qs = $("#simQs");
  const answers = store.get("sim", {});
  const save = () => store.set("sim", answers);
  S.forEach((q, qi) => {
    const box = el("section", { class: "sim" });
    const tot = q.parts.reduce((a, p) => a + p.pts, 0);
    box.innerHTML = `<div class="sim-head"><b>${qi + 1}. Dado el siguiente código:</b><span class="pts">/ ${tot}</span></div>${q.files ? filesHTML(q.files) : ""}<div class="snip"><pre>${hl(q.code)}</pre></div>`;
    q.parts.forEach((p, pi) => {
      const key = `${qi}.${pi}`;
      const part = el("div", { class: "part" });
      part.innerHTML = `<div class="part-q"><p>${p.q}</p><span class="pts">/ ${p.pts}</span></div>`;
      let input;
      if (p.type === "valor") { input = el("input", { class: "ans-line", id: "sim-" + key, spellcheck: "false", placeholder: "Tu respuesta (ej: [3, 4] o 'hola' o el nombre del error)", "aria-label": "Respuesta" }); }
      else { input = el("textarea", { id: "sim-" + key, spellcheck: "false", placeholder: p.type === "salida" ? "Escribí lo que imprime, una línea por print" : "Tu explicación", "aria-label": "Respuesta" }); }
      input.value = answers[key] || "";
      input.addEventListener("input", () => { answers[key] = input.value; save(); });
      part.append(input);
      const fb = el("div", { class: "pfb" });
      part.append(fb);
      p._input = input; p._fb = fb; p._key = key;
      box.append(part);
    });
    qs.append(box);
  });
  $("#simReset").addEventListener("click", e => {
    const b = e.currentTarget;
    if (!b.dataset.c) { b.dataset.c = "1"; b.textContent = "Tocá otra vez para borrar"; setTimeout(() => { b.dataset.c = ""; b.textContent = "Borrar respuestas"; }, 3500); return; }
    store.set("sim", {}); renderSim();
  });
  let timerId = null;
  $("#simTimer").addEventListener("click", e => {
    if (timerId) { clearInterval(timerId); timerId = null; e.currentTarget.textContent = "Iniciar cronómetro de 120 min"; $("#simClock").textContent = ""; return; }
    const end = Date.now() + 120 * 60000; e.currentTarget.textContent = "Detener";
    const tick = () => { const ms = Math.max(0, end - Date.now()); const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; $("#simClock").textContent = `Quedan ${m}:${String(s).padStart(2, "0")}`; if (!ms) { clearInterval(timerId); timerId = null; } };
    tick(); timerId = setInterval(tick, 1000);
  });
  $("#simGrade").addEventListener("click", async e => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "Corrigiendo…";
    let score = 0;
    try {
      for (const [qi, q] of S.entries()) {
        for (const p of q.parts) {
          const ans = p._input.value;
          if (p.type === "valor") {
            const r = await pycall("eval_value", { setup: q.code, expr: p.expr, ans, files: q.files || {} });
            const ok = r.ok; if (ok) score += p.pts;
            p._fb.innerHTML = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "✔ Correcto" : "✘ Incorrecto"} · valor real: <code>${esc(r.value || (r.error && r.error.trace) || "")}</code></div>${p.explain ? `<div class="model">${p.explain}</div>` : ""}`;
          } else if (p.type === "salida") {
            const r = await pycall("predict", { code: p.code || q.code, stdin: p.stdin || "", files: q.files || {}, pred: ans });
            if (r.ok) score += p.pts;
            p._fb.innerHTML = `<div class="verdict ${r.ok ? "ok" : "bad"}">${r.ok ? "✔ Correcto" : "✘ No coincide"} · salida real:</div><pre class="out" style="border-radius:8px;margin-top:6px">${outHTML(r)}</pre>${p.explain ? `<div class="model">${p.explain}</div>` : ""}`;
          } else {
            const k = "self:" + p._key;
            const checked = !!answers[k];
            if (checked) score += p.pts;
            p._fb.innerHTML = `<div class="model"><b>Respuesta modelo.</b> ${p.model}</div><label class="selfcheck"><input type="checkbox" ${checked ? "checked" : ""}> La respondí bien (suma ${p.pts} puntos)</label>`;
            const cb = $("input", p._fb);
            cb.addEventListener("change", () => { answers[k] = cb.checked; save(); });
          }
        }
      }
      $("#simScore").textContent = `${score} / 100`;
      const row = SCALE.find(([a, b]) => score >= a && score <= b);
      $("#simNote").textContent = row[2] === "Desaprobado" ? "Desaprobado: necesitás 60 para el 4." : `Nota: ${row[2]}`;
      document.querySelectorAll("#simScale div").forEach(d => d.classList.toggle("hit", score >= +d.dataset.a && score <= +d.dataset.b));
      store.set("simLast", score);
    } catch (err) { $("#simNote").textContent = "Python no está disponible: " + (err.message || err); }
    btn.disabled = false; btn.textContent = "Corregir de nuevo";
  });
}

/* ---------- consola ---------- */
let conEd;
function openConsole(code, stdin) {
  const c = $("#console");
  c.hidden = false; $("#fab").hidden = true;
  if (!conEd) conEd = makeEditor($("#conEd"), store.get("console", DATA.consoleStarter), { onRun: runConsole, onChange: v => store.set("console", v) });
  if (code != null) { conEd.set(code); store.set("console", code); $("#conStdin").value = stdin || ""; }
  ensurePy();
  conEd.focus();
}
async function runConsole() {
  const out = $("#conOut"), btn = $("#conRun");
  btn.disabled = true; out.innerHTML = `<span class="note">Ejecutando…</span>`;
  try { const r = await pycall("run_program", { code: conEd.get(), stdin: $("#conStdin").value, where: "consola" }); out.innerHTML = outHTML(r) + (r.error ? "\n" + errHelpHTML(r.error).replace(/<[^>]+>/g, "") : ""); refreshFiles(); }
  catch (e) { out.innerHTML = `<span class="err">Python no está disponible: ${esc(e.message || e)}</span>`; }
  btn.disabled = false;
}
async function refreshFiles() {
  try {
    await ensurePy();
    const files = JSON.parse(py.globals.get("list_files")());
    const fl = $("#conFlist"); fl.innerHTML = "";
    for (const f of files) {
      const b = el("button", { class: "sbtn" }, esc(f.name));
      b.addEventListener("click", () => { const v = $("#conFview"); v.hidden = false; v.textContent = f.content || "(vacío)"; });
      fl.append(b);
    }
  } catch { }
}
function wireConsole() {
  $("#fab").addEventListener("click", () => openConsole());
  $("#conClose").addEventListener("click", () => { $("#console").hidden = true; $("#fab").hidden = false; });
  $("#conWide").addEventListener("click", () => $("#console").classList.toggle("wide"));
  $("#conRun").addEventListener("click", runConsole);
  $("#conClear").addEventListener("click", () => { $("#conOut").innerHTML = ""; });
  $("#conResetFiles").addEventListener("click", async () => { await ensurePy(); py.globals.get("reset_console")(JSON.stringify(CONSOLE_FILES)); refreshFiles(); $("#conOut").innerHTML = `<span class="note">Archivos de ejemplo restaurados.</span>`; });
  $("#conFiles").addEventListener("toggle", e => { if (e.target.open) refreshFiles(); });
  const hist = []; let hi = 0;
  $("#conRepl").addEventListener("keydown", async e => {
    const inp = e.currentTarget;
    if (e.key === "ArrowUp") { if (hi > 0) { hi--; inp.value = hist[hi]; } e.preventDefault(); return; }
    if (e.key === "ArrowDown") { if (hi < hist.length) { hi++; inp.value = hist[hi] || ""; } e.preventDefault(); return; }
    if (e.key !== "Enter" || !inp.value.trim()) return;
    const src = inp.value; hist.push(src); hi = hist.length; inp.value = "";
    const out = $("#conOut");
    try {
      const r = await pycall("console_eval", src);
      out.innerHTML += `\n<span class="note">&gt;&gt;&gt; ${esc(src)}</span>\n` + esc(r.out || "") + (r.error ? `<span class="err">${esc(r.error.trace.split("\n").pop())}</span>` : "");
    } catch (err) { out.innerHTML += `\n<span class="err">${esc(err.message || err)}</span>`; }
    out.scrollTop = out.scrollHeight;
    refreshFiles();
  });
}

/* ---------- tema claro/oscuro ---------- */
function wireTheme() {
  const saved = store.get("theme", null);
  if (saved) document.documentElement.dataset.theme = saved;
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("theme", next);
  });
}

renderNav(); wireConsole(); wireTheme(); updateProgress(); route();
window.addEventListener("hashchange", route);
const narrow = () => matchMedia("(max-width: 900px)").matches;
function syncSide() {
  const shown = narrow() ? $("#side").classList.contains("open") : !document.body.classList.contains("side-hidden");
  $("#menuBtn").setAttribute("aria-expanded", String(shown));
  $("#sideClose").textContent = narrow() ? "✕ Cerrar" : "« Ocultar barra";
}
function toggleSide(force) {
  if (narrow()) $("#side").classList.toggle("open", force);
  else {
    const hide = force === undefined ? !document.body.classList.contains("side-hidden") : !force;
    document.body.classList.toggle("side-hidden", hide);
    store.set("sideHidden", hide);
  }
  syncSide();
}
if (store.get("sideHidden", false)) document.body.classList.add("side-hidden");
$("#menuBtn").addEventListener("click", () => toggleSide());
$("#sideClose").addEventListener("click", () => toggleSide(false));
document.addEventListener("click", e => { if (narrow() && $("#side").classList.contains("open") && !e.target.closest("#side, #menuBtn")) toggleSide(false); });
matchMedia("(max-width: 900px)").addEventListener("change", syncSide);
syncSide();
ensurePy().catch(() => { });
